<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bit-Burbs — Build Your Block</title>
<meta name="theme-color" content="#172320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="bitburbs-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Anton&family=VT323&family=Silkscreen:wght@400;700&display=swap">
<style>
:root{
  --ink:#0B0E13; --cream:#F2F5F8; --muted:#9AA6B4;
  --ui:#1C222B; --ui-deep:#12161C; --ui-hi:#2A323D; --ui-row:#1F262F; --ui-row2:#262E38;
  --tan:#E9EDF2; --tan-hi:#FFFFFF; --tan-lo:#C5CDD6;
  --gold:#2F6FEB; --red:#C9434A; --teal:#6FA8FF; --green:#2F6FEB; --magenta:#2F6FEB; --blue:#2F6FEB; --sky:#6FA8FF; --navy:#16325C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --ui:#1A2028; --ui-deep:#101418; }
}
:root[data-theme="dark"]{ color-scheme:dark; --ui:#1A2028; --ui-deep:#101418; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;overflow:hidden;background:#0B1030}
body{font-family:'Oswald',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--cream);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ui-deep)}
button{font:inherit}
button:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated;filter:saturate(1.12) contrast(1.05) brightness(1.03)}

/* pixel buttons */
.pb{font-weight:600;font-size:16px;letter-spacing:.02em;min-height:44px;padding:0 14px;border:1px solid rgba(255,255,255,.07);border-radius:10px;color:#FFFFFF;cursor:pointer;background:linear-gradient(#4A84F2,#2F6FEB);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.22);display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.1;text-transform:none}
.pb:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.25),0 1px 0 var(--ink)}
.pb.red{background:linear-gradient(#D65A60,#C9434A);color:#FFFFFF}.pb.teal{background:linear-gradient(#8DBBFF,#6FA8FF);color:var(--ink)}.pb.green{background:linear-gradient(#4A84F2,#2F6FEB);color:#FFFFFF}.pb.purple{background:linear-gradient(#36404D,#2A323D);color:var(--cream)}.pb.cream{background:linear-gradient(#FFFFFF,#E3E8EE);color:var(--ink)}
.pb[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.pb.sm{font-size:13px;padding:0 10px}
.sq{width:44px;height:44px;padding:0;font-size:20px}

/* HUD */
#hud{border-bottom:0!important;box-shadow:0 4px 18px rgba(0,0,0,.35)!important;position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;background:linear-gradient(var(--ui-hi),var(--ui) 40%,var(--ui-deep));border-bottom:1px solid rgba(255,255,255,.07);box-shadow:0 0 0 transparent;display:flex;flex-direction:column;gap:7px}
.hrow{display:flex;align-items:center;gap:8px}
.lvl{border:0!important;border-radius:12px!important;width:40px;height:40px;border-radius:8px;background:linear-gradient(#4A84F2,#2F6FEB);border:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#FFFFFF;flex-shrink:0;}
.cname{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cname b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cname b small{font-weight:500;font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:.04em}
.cname b.wm{letter-spacing:.14em;font-size:15px;font-weight:700}
.xp{height:6px;border-radius:99px!important;border:0!important;background:rgba(255,255,255,.1)!important;border:1px solid rgba(255,255,255,.07);border-radius:4px;background:var(--ui-deep);overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(#8DBBFF,#2F6FEB)}
#clock{border:0!important;background:rgba(255,255,255,.06)!important;border-radius:10px!important;display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600;background:rgba(8,16,26,.45);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:4px 7px;white-space:nowrap}
#boost{font-weight:700;font-size:12px;background:var(--blue);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:3px 6px;white-space:nowrap}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.chip{display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(255,255,255,.06);border-radius:10px!important;border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:4px 3px;font-weight:600;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip canvas{flex-shrink:0}

/* advisor */
#advisor{position:fixed;left:8px;z-index:15;display:flex;align-items:center;gap:8px;max-width:200px;background:linear-gradient(var(--ui-hi),var(--ui));color:var(--cream);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:6px 10px 6px 6px;cursor:pointer;text-align:left;;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#advisor:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#advisor canvas{flex-shrink:0}
#advisor .adv{display:flex;flex-direction:column;min-width:0}
#advisor b{font-size:14px;font-weight:600;line-height:1.15}
#advisor small{font-size:12px;font-weight:500;color:var(--muted);line-height:1.2}
#advisor.warn{background:linear-gradient(#7A3238,#5A2328)}
#advisor.warn small{color:#FFE3D6}
#mapctl{position:fixed;right:8px;z-index:15;display:flex;flex-direction:column;gap:8px}
#legend{border:0!important;border-radius:10px!important;position:fixed;left:50%;transform:translateX(-50%);z-index:15;background:rgba(30,26,71,.92);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;display:none;white-space:nowrap}
#legend.show{display:block}

/* nav */
#nav{border-top:0!important;box-shadow:0 -4px 18px rgba(0,0,0,.35)!important;position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);background:linear-gradient(var(--ui),var(--ui-deep));border-top:1px solid rgba(255,255,255,.07);box-shadow:0 0 0 transparent;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
#nav .pb{flex-direction:column;gap:3px;min-height:58px;font-size:12px;position:relative;padding:4px 0;letter-spacing:0}
.dot{border:0!important;position:absolute;top:-9px;right:-5px;min-width:22px;height:22px;border-radius:11px;background:#FFFFFF;color:var(--ink);border:1px solid rgba(255,255,255,.07);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}
.dot[hidden]{display:none}

/* info card */
#card{position:fixed;left:8px;right:8px;z-index:18;padding:12px;display:none;flex-direction:column;gap:10px;max-width:520px;margin:0 auto;background:linear-gradient(var(--ui-hi),var(--ui) 30%);border:1px solid rgba(255,255,255,.07);border-radius:8px;;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#card.show{display:flex}
.chead{display:flex;align-items:flex-start;gap:10px}
.chead h2{margin:0;font-size:20px;line-height:1.1}
.chead p{margin:3px 0 0;font-size:14px;font-weight:500;color:var(--muted)}
.chead .x{margin-left:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .pb{flex:1}
.bar{height:10px;border-radius:99px!important;border:0!important;background:rgba(255,255,255,.1)!important;border:1px solid rgba(255,255,255,.07);border-radius:4px;background:var(--ui-deep);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#8DBBFF,#2F6FEB);width:0}
.tags{display:flex;flex-wrap:wrap;gap:5px;font-size:13px;font-weight:600}
.tag{border:0!important;border-radius:6px!important;background:var(--ui-deep);border:1px solid rgba(255,255,255,.07);border-radius:5px;padding:2px 7px}
.tag.ok{background:#1F4E8C}.tag.bad{background:#6E2A30}
.note{font-size:14px;font-weight:500;margin:0;color:var(--cream)}

/* sheets */
#scrim{position:fixed;inset:0;z-index:30;background:rgba(6,12,20,.55);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{border:0!important;border-radius:18px 18px 0 0!important;position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:84%;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.07);border-bottom:none;border-radius:10px 10px 0 0;background:linear-gradient(var(--ui-hi),var(--ui) 60px);box-shadow:inset 0 0 0 2px rgba(111,168,255,.4);transform:translateY(105%);transition:transform .25s ease;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.open{transform:none}
.shead{display:flex;align-items:center;gap:10px;padding:12px 12px 8px}
.shead h2{margin:0;font-size:22px;flex:1;color:#FFFFFF;letter-spacing:.04em;text-transform:uppercase}
.sbody{overflow-y:auto;padding:0 12px 16px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs .pb{flex:0 0 auto;font-size:12px;padding:0 10px}
.tabs .pb[aria-pressed="false"]{background:var(--ui-deep);color:var(--cream)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bcard{border:1px solid rgba(0,0,0,.06)!important;border-radius:14px!important;border:1px solid rgba(255,255,255,.07);border-radius:8px;background:linear-gradient(var(--tan-hi),var(--tan));padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink);text-align:center;box-shadow:none}
.bcard canvas{width:110px;height:92px}
.bcard b{font-size:15px}
.bcard span{font-size:12px;font-weight:500}
.bcard .price{font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px}
.bcard[aria-disabled="true"]{filter:grayscale(.7);opacity:.6;cursor:not-allowed}
.sect{border:0!important;border-radius:14px!important;border:1px solid rgba(255,255,255,.07);border-radius:8px;background:var(--ui-deep);padding:10px;display:flex;flex-direction:column;gap:8px}
.sect h3{margin:0;font-size:14px;color:var(--sky);letter-spacing:.06em;text-transform:uppercase}
.task{display:flex;align-items:center;gap:10px}
.task .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.task .info small{font-weight:500;font-size:13px;color:var(--muted)}

/* mini-game modal */
#mg{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(6,12,20,.7);padding:calc(env(safe-area-inset-top,0px) + 10px) 8px calc(env(safe-area-inset-bottom,0px) + 10px)}
#mg.show{display:flex}
.mgp{border:0!important;border-radius:18px!important;position:relative;width:min(420px,100%);max-height:100%;overflow-y:auto;border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:14px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.mgp.tan{background:linear-gradient(var(--tan-hi),var(--tan) 50px);color:var(--ink);box-shadow:,inset 0 0 0 3px var(--tan-lo)}
.mgp.purple{background:radial-gradient(circle at 50% 25%,#2A323D,#1C222B 60%,#12161C);color:var(--cream)}
.mgtitle{font-size:22px;font-weight:700;color:#FFFFFF;margin:0;letter-spacing:.12em}
.mgp.tan .mgtitle{color:var(--ink)}
.mgx{position:absolute;top:8px;right:8px}
.mgcanvas{display:block;max-width:100%}
.bigdie{border:0!important;border-radius:16px!important;width:76px;height:76px;background:linear-gradient(#FFFFFF,#D5DCE4);border:1px solid rgba(255,255,255,.07);border-radius:10px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;gap:4px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.bigdie i{border-radius:2px}
.bigdie i.on{background:var(--ink)}
.bigdie.tumble{animation:tumble .12s linear infinite}
@keyframes tumble{0%{transform:rotate(-12deg) translateY(-6px)}50%{transform:rotate(12deg) translateY(2px)}100%{transform:rotate(-12deg) translateY(-6px)}}
.cnt{background:rgba(11,14,19,.12);border:1px solid rgba(255,255,255,.07);border-radius:4px;padding:2px 10px;font-weight:700;font-size:16px}
.mgmsg{font-size:15px;font-weight:600;text-align:center;min-height:20px;margin:0}
.ptable{border:0!important;border-radius:12px!important;width:100%;border:1px solid rgba(255,255,255,.07);border-radius:4px;overflow:hidden;color:var(--cream)}
.ptable .ph{background:var(--magenta);padding:6px 10px;font-weight:700;font-size:16px;text-shadow:0 2px 0 var(--ink)}
.ptable .pr{display:flex;align-items:center;gap:8px;padding:5px 10px;font-weight:600;font-size:15px;background:var(--ui-row)}
.ptable .pr:nth-child(odd){background:var(--ui-row2)}
.ptable .pr span{flex:1}
.ptable .pr canvas{flex-shrink:0}
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.tier{border-radius:12px!important;border:1px solid rgba(255,255,255,.07);border-radius:6px;background:var(--ui-deep);color:var(--cream);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:600;font-size:14px;min-height:96px}
.tier[aria-pressed="true"]{background:linear-gradient(#4A84F2,#2F6FEB);color:#FFFFFF}
.tier small{font-weight:500;font-size:12px}
.pips{border:0!important;border-radius:12px!important;display:flex;gap:4px;align-items:center;width:100%;background:linear-gradient(#2A323D,#1C222B);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:8px}
.pips i{border:0!important;flex:1;height:22px;border:1px solid rgba(255,255,255,.07);border-radius:4px;background:#12161C}
.pips i.on{background:linear-gradient(#8DBBFF,#2F6FEB)}
.pips canvas{flex-shrink:0;margin-left:4px}

.grind{display:flex;align-items:center;gap:8px;width:100%;font-size:14px;font-weight:600}
.grind .bar{flex:1}
.grind b{min-width:44px;text-align:right}
.mgp.tan .bar,.bcard .bar{background:rgba(11,14,19,.1)!important}
/* star market */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.mcard{border:1px solid rgba(0,0,0,.06)!important;border-radius:14px!important;border:1px solid rgba(255,255,255,.07);border-radius:8px;background:linear-gradient(var(--tan-hi),var(--tan));color:var(--ink);padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:none}
.mcard.feat{grid-column:1/-1;flex-direction:row;text-align:left;background:linear-gradient(#FFFFFF,#DCE6F5);box-shadow:none}
.minfo{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;width:100%}
.mcard em{font-style:normal;font-size:12px;font-weight:600;color:#2F6FEB;letter-spacing:.04em;text-transform:uppercase}
.mcard b{font-size:16px}
.mcard span{font-size:13px;font-weight:500}
.mcard .mleft{font-size:12px;font-weight:600;color:#5A6676}
.mcard .pb{margin-top:auto;font-size:16px;text-transform:none}
.chip[aria-label="Dosh"]{cursor:pointer}
/* toast + modal */
#toast{position:fixed;left:50%;z-index:60;transform:translate(-50%,-10px);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;background:var(--ui-deep);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:8px 14px;font-weight:700;font-size:15px;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(6,12,20,.65);padding:20px}
#modal.show{display:flex}
#modalBox{padding:18px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center;background:radial-gradient(circle at 50% 20%,#2A323D,#1C222B 70%);border:1px solid rgba(255,255,255,.07);border-radius:8px;;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#modalBox h2{margin:0;font-size:24px;color:#FFFFFF;letter-spacing:.06em}
#modalBox ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
@media (prefers-reduced-motion: reduce){
  #sheet,#toast{transition:none}
  .bigdie.tumble{animation:none}
}

/* ===== modern glass UI ===== */
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif!important}
.pb{background:#0A84FF!important;color:#FFFFFF!important;border:0!important;box-shadow:none!important;border-radius:12px!important;font-weight:600!important;letter-spacing:0!important;text-transform:none!important;font-family:inherit!important}
.pb:active{transform:scale(.97)!important;filter:brightness(.92)}
.pb.green{background:#0A84FF!important}
.pb.purple,.pb.teal{background:rgba(255,255,255,.1)!important;color:#F2F5F8!important}
.pb.cream{background:rgba(255,255,255,.1)!important;color:#F2F5F8!important}
.pb.red{background:rgba(255,69,58,.9)!important;color:#FFFFFF!important}
.pb.sq{border-radius:50%!important;background:rgba(22,26,32,.72)!important;color:#F2F5F8!important;backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.08)!important}
#zmkt{color:#FFD60A!important}
.mgx,.chead .x,.shead .pb{background:rgba(255,255,255,.12)!important;border-radius:50%!important;border:0!important;width:36px!important;height:36px!important;min-height:36px!important;font-size:15px!important;backdrop-filter:none}
#hud,#nav{background:rgba(14,17,22,.78)!important;backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:none!important}
#hud{border-bottom:1px solid rgba(255,255,255,.06)!important}
#nav{border-top:1px solid rgba(255,255,255,.06)!important;gap:0!important;padding-top:6px!important}
#nav .pb{background:transparent!important;color:#8E98A6!important;min-height:52px!important;font-size:11px!important;font-weight:500!important;border-radius:10px!important}
#nav .pb svg{width:24px;height:24px}
#nav .pb[data-open="build"]{color:#0A84FF!important}
.dot{background:#FF453A!important;color:#FFFFFF!important;border-radius:10px!important;top:-2px!important;right:14%!important;min-width:18px!important;height:18px!important;font-size:11px!important}
.chip{background:transparent!important;border:0!important;font-weight:600!important;font-size:15px!important;color:#F2F5F8;gap:5px!important}
.chip svg{width:17px;height:17px;color:#8E98A6;flex-shrink:0}
.lvl{background:transparent!important;border:1.5px solid rgba(255,255,255,.25)!important;border-radius:50%!important;width:34px!important;height:34px!important;font-size:15px!important;color:#FFFFFF!important}
.cname b.wm{font-size:14px!important;letter-spacing:.16em!important;font-weight:600!important}
.xp i,.bar i{background:#0A84FF!important}
#clock{font-weight:500!important;font-size:13px!important}
#card,#sheet,.mgp,#modalBox,#advisor,#toast,#legend{background:rgba(22,26,32,.84)!important;backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,.08)!important;color:#F2F5F8!important}
.mgp.tan{color:#F2F5F8!important}
.mgp.tan .mgtitle,.mgtitle{color:#FFFFFF!important;font-size:17px!important;font-weight:600!important;letter-spacing:.02em!important}
.shead h2{font-size:17px!important;letter-spacing:.02em!important;text-transform:none!important;font-weight:600!important}
.sect h3{color:#8E98A6!important;font-size:12px!important;font-weight:600!important}
#advisor{border-radius:14px!important}
#advisor.warn{background:rgba(120,30,30,.72)!important}
#advisor b{font-weight:600!important}

/* ===== Bit-Burbs: Light Navy + Pop refresh ===== */
:root{
  --ink:#14263D; --cream:#F5FAFF; --muted:#D2E1F1;
  --ui:#52749D; --ui-deep:#3B5B82; --ui-hi:#6689B3; --ui-row:#496B94; --ui-row2:#587BA4;
  --tan:#DCEBFA; --tan-hi:#F3F8FF; --tan-lo:#B8D0E8;
  --gold:#FFC247; --red:#FF626C; --teal:#29C5D8; --green:#71D65C; --magenta:#D47BE8; --blue:#38A7F5; --sky:#8DDCF2; --navy:#314F76;
}
html,body{background:#496B93!important;color:#F5FAFF!important}
body{font-family:'Oswald',system-ui,sans-serif!important}
#hud{background:linear-gradient(180deg,#5479A4F7,#45688FF5)!important;border-bottom:2px solid #8EAFD1!important;box-shadow:0 4px 16px #19365355!important}
#nav{background:linear-gradient(180deg,#45688FF5,#36577FF8)!important;border-top:2px solid #8EAFD1!important;box-shadow:0 -4px 16px #19365355!important;gap:5px!important}
#nav .pb{background:#587BA4!important;color:#F3F8FF!important;border:2px solid #789BC2!important;box-shadow:inset 0 2px 0 #A9C5E2,0 3px 0 #2D4B70!important;min-height:56px!important;letter-spacing:.02em!important;font-size:11px!important;text-shadow:0 1px 1px #29496B!important}
#nav .pb[data-open="build"]{background:#20B8D2!important;color:#102C45!important;border-color:#A5F0F5!important;box-shadow:inset 0 2px 0 #D5FFFF,0 3px 0 #087E9A!important;text-shadow:none!important}
.pb,.pb.green{background:linear-gradient(#36C5DC,#119BBE)!important;color:#082D45!important;border:2px solid #A8F2F7!important;border-left:2px solid #A8F2F7!important;box-shadow:inset 0 2px 0 #D9FFFF,0 3px 0 #08758F!important;text-shadow:none!important;letter-spacing:.025em!important;border-radius:0!important}
.pb:active:not(:disabled){background:#79E0E9!important;color:#12324A!important;transform:translateY(2px)!important;box-shadow:inset 0 2px 0 #CFFFFF,0 1px 0 #08758F!important}
.pb.purple,.pb.teal,.pb.cream{background:linear-gradient(#8D83EE,#675CD0)!important;color:#FFFFFF!important;border-color:#C5BFFF!important;box-shadow:inset 0 2px 0 #E0DCFF,0 3px 0 #403A91!important}
.pb.red{background:linear-gradient(#FF7A7F,#E84958)!important;color:#FFFFFF!important;border-color:#FFC0C3!important;box-shadow:inset 0 2px 0 #FFE1E2,0 3px 0 #A52C3B!important}
.pb.gold{background:linear-gradient(#FFD86A,#F2A927)!important;color:#3B2A0C!important;border-color:#FFF0B2!important}
.pb.sq{background:#3D5F87!important;color:#FFFFFF!important;border:2px solid #91B2D6!important;box-shadow:inset 0 2px 0 #7898BA,0 2px 0 #2A476B!important}
#rollBtn,#spinBtn,#openBtn,[data-act="confirmPlace"],[data-act="collect"],[data-act="restock"]{background:linear-gradient(#FFBE4D,#F28B27)!important;color:#39230A!important;border:2px solid #FFE0A0!important;box-shadow:inset 0 2px 0 #FFF0C7,0 4px 0 #A95A17,0 6px 12px #17345155!important;text-shadow:none!important}
#rollBtn:active:not(:disabled),#spinBtn:active:not(:disabled),#openBtn:active:not(:disabled){background:#FFD47B!important;transform:translateY(2px)!important;box-shadow:inset 0 2px 0 #FFF0C7,0 2px 0 #A95A17!important}
#rollBtn,#spinBtn,#openBtn{animation:none!important}
.lvl{background:linear-gradient(#FFD66B,#F0A72B)!important;color:#3C2A0C!important;border:2px solid #FFF0B0!important}
.cname b.wm{color:#FFFFFF!important;text-shadow:2px 2px 0 #29496B!important}
.cname b small{color:#D6E9FA!important}
.xp{background:#2F4E73!important;border:1px solid #A4C3E1!important}
.xp i,.bar i{background:linear-gradient(90deg,#A2EB69,#45C9A5)!important}
.chip{background:#3F6189!important;border:1px solid #789CC3!important;color:#FFFFFF!important;text-shadow:0 1px 1px #1D3B5C!important}
.chip[aria-label="Coins"]{color:#FFE28A!important}.chip[aria-label="Dosh"]{color:#BDF39C!important}
#clock{background:#385A81!important;color:#FFFFFF!important;border:1px solid #86A9D0!important}
#card,#advisor,#legend,#toast,#modalBox{background:#466A94!important;border:2px solid #91B2D5!important;color:#F6FAFF!important;box-shadow:0 8px 24px #18365366!important}
#sheet{background:#4C709A!important;border:2px solid #91B2D5!important;border-top:4px solid #2BC3D7!important;box-shadow:0 -12px 30px #18365366!important}
.shead{background:#5D80AA!important;border-bottom:2px solid #8DAFD2!important}
.shead h2,.chead h2{color:#FFFFFF!important;text-shadow:0 1px 1px #29496B!important}
#advisor{border-left:5px solid #FFD05A!important}
#advisor.warn{background:#8B4E5A!important;border-left-color:#FF8A83!important}
#advisor.warn b,#advisor.warn small{color:#FFFFFF!important}
#sheet .bcard,.bcard,.mcard{background:#E7F1FC!important;color:#193652!important;border:2px solid #A8C4E1!important;box-shadow:0 2px 0 #345779!important}
.bcard b,.mcard b{color:#183650!important}
.bcard span,.mcard span{color:#426384!important}
.mcard.feat{background:#D7F7F8!important;border-color:#26B8CA!important}
.mcard em{color:#087F9A!important}.mcard .mleft{color:#496987!important}
.sect,.tier,.pips,.cnt{background:#385B82!important;color:#F7FBFF!important;border:2px solid #789BC1!important}
.sect h3{color:#A8F0F1!important}
.tier[aria-pressed="true"],.pips i.on{background:linear-gradient(#8BE66D,#45BE67)!important;color:#173A2C!important;border:1px solid #D4FFC0!important}
.ptable .ph{background:#2E9FBD!important;color:#FFFFFF!important}
.ptable .pr,.ptable .pr:nth-child(odd){background:#3D6088!important;color:#FFFFFF!important}
.tag{background:#35577E!important;color:#FFFFFF!important}
.tag.ok{background:#2F805C!important;color:#E2FFE9!important}
.tag.bad{background:#A94E5B!important;color:#FFFFFF!important}
.dot{background:#FF626C!important;color:#FFFFFF!important;border:2px solid #FFD1D3!important}
.mgp{border:3px solid #A8C5E2!important;box-shadow:0 12px 34px #102B4B88!important}
.mgtitle{border-bottom:2px solid #A8C5E2!important}
.mg-wheel .mgmsg,.mg-wheel .grind{color:#FFFFFF!important;text-shadow:0 1px 1px #25104B!important}
.mg-wheel .cnt{background:#345D9B!important;color:#FFFFFF!important}
.mg-wheel .pips{background:#284D86!important;border-color:#9FC2F0!important}
.mg-wheel .wodds{background:#F5FAFF!important;color:#203A58!important;border:2px solid #A9C7E4!important}
.mg-wheel .wodds summary{color:#203A58!important}
#toast{background:#355A82!important}
button:focus-visible{outline:3px solid #FFF2A8!important;outline-offset:3px!important}
.pb[disabled]{filter:saturate(.45)!important;opacity:.68!important}
@media(max-width:380px){#nav .pb{font-size:10px!important}.chip{font-size:13px!important}}



/* ===== legibility and connected road polish ===== */
#card,#sheet,#modalBox,#advisor,#toast,#legend,.mgp{color:#FFFFFF!important}
.chead h2,.chead p,.note,.task .info,.task .info small,#modalBox ul,#modalBox li,.mgmsg,.grind,.ptable .pr,.tier small{color:#F3F5FF!important}
.chead p,.note,.task .info small,#advisor small{font-weight:600!important;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.bcard,.mcard,.mcard.feat{background:#2D3970!important;color:#FFFFFF!important;border:2px solid #171D48!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.12)!important}
.bcard b,.bcard span,.bcard .price,.mcard b,.mcard span,.mcard .mleft{color:#FFFFFF!important;text-shadow:0 1px 1px rgba(0,0,0,.28)}
.mcard em{color:#FFE066!important;font-weight:700!important}
.bcard[aria-disabled="true"]{opacity:.78!important;filter:none!important}
.sect h3{color:#FFE066!important;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.tag{color:#FFFFFF!important}
.tag.ok{color:#A8F0B6!important}.tag.bad{color:#FFD0D0!important}
.tabs .pb[aria-pressed="false"]{color:#F3F5FF!important}
.tabs .pb[aria-pressed="true"]{color:#20264A!important;font-weight:700!important}
#nav .pb{color:#D8DDF5!important;text-shadow:0 1px 2px rgba(0,0,0,.45)}
#nav .pb[data-open="build"]{color:#FFFFFF!important}
#clock,#boost,.chip{color:#FFFFFF!important}
#advisor b{color:#FFFFFF!important}
#modalBox .wl-s{color:#F3F5FF!important}

/* Tier-specific chest presentation; keep these after the base mini-game theme rules. */
.mgp.mg-crates.diamond-chest{background:radial-gradient(circle at 50% 18%,#C7F4FF 0%,#69C9EF 42%,#145D96 100%)!important}
.mgp.mg-crates.diamond-chest .mgtitle{background:linear-gradient(90deg,#E9FCFF,#7ADCF8,#E9FCFF)!important;color:#123B5A!important}
.mgp.mg-crates.diamond-chest .ctier[data-tier="diamond"]{background:linear-gradient(180deg,#F3FDFF,#8DDBF6);border-color:#E9FCFF;box-shadow:0 0 0 2px rgba(255,255,255,.3),0 3px 0 rgba(8,22,42,.25)}
.mgp.mg-crates.gold-chest .ctier[data-tier="gold"]{background:linear-gradient(180deg,#FFF8DC,#F3D17A);border-color:#B77A19}
.mgp.mg-crates.silver-chest .ctier[data-tier="steel"]{background:linear-gradient(180deg,#FFFFFF,#CBD7E5);border-color:#73859B}
.mgp.mg-crates.diamond-chest #chest{filter:drop-shadow(0 0 9px rgba(255,255,255,.7));transform:scale(1.035)}


/* Progress hub and settings polish */
.task-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:12px}.task-tabs .pb{font-size:10px;min-height:42px;padding:5px 2px;white-space:normal}.rank-card{background:linear-gradient(135deg,#183d60,#236b91);border:2px solid #69c8ed;padding:14px;color:#fff;text-align:center;margin:8px 0}.rank-name{font-family:VT323,monospace;font-size:22px;letter-spacing:2px;color:#b7edff}.rank-level{font-size:12px;margin:5px 0 10px}.rank-card small{color:#e8f7ff}.task .pb:disabled{opacity:.55}.task .info b{display:block}.bcard small{color:var(--muted)}





/* ===== final pixel readability and interface polish ===== */
body,button,input,select,textarea{font-family:'VT323',monospace!important}
body{font-size:18px!important;letter-spacing:.015em}
#hud .chip,#clock,#boost{font-family:'VT323',monospace!important;font-size:20px!important}
.pb{font-family:'VT323',monospace!important;font-size:19px!important;letter-spacing:.035em!important;line-height:1.05!important}
.pb.sm{font-size:17px!important}
#nav{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:4px!important}
#nav .pb{font-size:16px!important;min-width:0!important;padding:4px 2px!important}
#nav .pb canvas{width:23px!important;height:23px!important}

#sheetBody{font-size:18px!important;line-height:1.22}
.note,.sect p,.task small,.bcard small,.mcard small{font-family:'VT323',monospace!important;font-size:17px!important;line-height:1.15!important;color:#E4E9F8!important}
.task-tabs{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:7px!important}
.task-tabs .pb{font-size:17px!important;min-height:42px!important;white-space:nowrap!important}
#sheetBody .sect{background:#1B2450!important;border:2px solid #414A9C!important;padding:12px!important;gap:10px!important}
#sheetBody .sect h3{font:12px 'VT323',monospace!important;color:#FFE066!important}
#sheetBody .grid2{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
#sheetBody .bcard{min-height:92px!important;background:#29366D!important;border:2px solid #5366B5!important;padding:8px!important;gap:5px!important}
#sheetBody .bcard b{font:12px 'VT323',monospace!important;color:#FFE58B!important}
#sheetBody .bcard span{font:17px 'VT323',monospace!important;color:#fff!important}
.daily-head{display:flex;align-items:center;justify-content:space-between;background:#253B78;border:2px solid #547BD2;padding:10px 12px;margin-bottom:10px}
.daily-head strong{display:block;font:12px 'VT323',monospace;color:#FFE066}
.daily-head small{display:block;font:16px 'VT323',monospace;color:#DCEAFF;margin-top:4px}
.daily-count{font:18px 'VT323',monospace;color:#fff;background:#3E7BFA;padding:7px 9px}
.daily-list{display:flex;flex-direction:column;gap:9px}
.daily-task-card{background:#202B57;border:2px solid #4B5C9B;padding:9px 10px;box-shadow:inset 4px 0 0 var(--task-accent)}
.task-col-0{--task-accent:#35B9E8}.task-col-1{--task-accent:#43C77A}.task-col-2{--task-accent:#F0B83A}.task-col-3{--task-accent:#D66CEB}.task-col-4{--task-accent:#F07863}
.daily-task-top{display:flex;align-items:center;gap:8px}
.daily-task-number{font:11px 'VT323',monospace;color:var(--task-accent);min-width:25px}
.daily-task-copy{flex:1;min-width:0}
.daily-task-copy b{display:block;font:17px 'VT323',monospace;color:#fff;line-height:1.1}
.daily-task-copy small{display:block;font:15px 'VT323',monospace;color:#C8D4F4;margin-top:3px}
.daily-reward{font:15px 'VT323',monospace;color:#FFE58B;text-align:right;max-width:90px}
.daily-progress{height:8px;background:#101735;margin:8px 0;border:1px solid #4A5B91}
.daily-progress i{display:block;height:100%;background:linear-gradient(90deg,#32C7E8,#62E28D);box-shadow:0 0 8px rgba(70,220,190,.35)}
.daily-claim{width:100%;min-height:32px!important;background:#3E7BFA!important}
.daily-claim:disabled{opacity:.72!important;background:#37436B!important;color:#C6CDE1!important}
#mgPanel.mgp.mg-crates{background:radial-gradient(ellipse at 50% 40%,#285B9D 0%,#173B78 55%,#101D4D 100%)!important;border:3px solid #65C8F4!important;box-shadow:0 0 0 4px #101735,0 0 35px rgba(62,190,255,.35)!important}
.mg-crates .mgtitle{background:linear-gradient(90deg,#3AC8F2,#5A78F5,#9B5BEE)!important;color:#fff!important;text-shadow:0 2px 0 #18295C!important}
.mg-crates .keysrow{background:rgba(8,20,57,.62)!important;border:2px solid rgba(150,218,255,.45)!important;padding:8px!important}
.mg-crates .ctiers{gap:8px!important;margin:10px 0!important}
.mg-crates .ctier{background:linear-gradient(#3C5F9D,#203A73)!important;color:#fff!important;border:2px solid #83BEEA!important;min-height:76px!important}
.mg-crates .ctier[aria-pressed="true"]{background:linear-gradient(#FFE27A,#F2A92D)!important;color:#261B12!important;border-color:#FFF0B0!important;transform:translateY(-2px)}
.mg-crates .cstage{position:relative;margin:10px 0 12px!important;min-height:220px!important;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 68%,rgba(95,215,255,.32),rgba(16,31,76,.12) 62%,transparent 72%)!important;border:2px solid rgba(122,204,255,.42)!important;box-shadow:inset 0 -12px 24px rgba(0,0,0,.22),0 5px 0 rgba(7,20,55,.5)!important;overflow:hidden}
.mg-crates .cstage:before{content:"";position:absolute;width:170px;height:26px;bottom:18px;border-radius:50%!important;background:rgba(87,209,255,.23);filter:blur(9px);animation:crateGlow 1.8s ease-in-out infinite}
.mg-crates #chest{position:relative;z-index:1;width:min(100%,360px)!important;height:auto!important;max-height:230px!important;animation:crateFloat 2.4s steps(4,end) infinite}
.mg-crates #openBtn{min-height:54px!important;background:linear-gradient(#FF6D54,#D82D48)!important;border:3px solid #FFE6A6!important;box-shadow:0 5px 0 #76213B,0 0 18px rgba(255,100,95,.3)!important;font:14px 'VT323',monospace!important;animation:crateButtonPulse 1.8s ease-in-out infinite}
.mg-crates #openBtn:disabled{animation:none;filter:grayscale(.6)}
.mg-crates .mgmsg{font:18px 'VT323',monospace!important;color:#fff!important}
.mg-crates .pity,.mg-crates .odds{background:rgba(8,20,57,.55)!important;border:1px solid rgba(150,218,255,.35)!important;color:#fff!important;padding:8px!important}
.mg-crates .cfoot{font:15px 'VT323',monospace!important;color:#D8E8FF!important}
@keyframes crateFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes crateGlow{0%,100%{opacity:.55;transform:scaleX(.82)}50%{opacity:1;transform:scaleX(1.12)}}
@keyframes crateButtonPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}
@media(prefers-reduced-motion:reduce){.mg-crates #chest,.mg-crates #openBtn,.mg-crates .cstage:before{animation:none!important}}


/* Readable, colourful daily rewards and challenge screens */
.streak-hero{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;background:linear-gradient(110deg,#244E9A,#513C9B);border:2px solid #75B9F5;margin:8px 0 10px}
.streak-hero strong{display:block;font:12px 'VT323',monospace;color:#FFE47A}
.streak-hero small{display:block;font:17px 'VT323',monospace;color:#EAF5FF;margin-top:5px}
.streak-count{font:11px 'VT323',monospace;color:#fff;background:#1B2D62;padding:8px;white-space:nowrap}
.streak-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.streak-card{min-width:0;min-height:128px;padding:9px;background:#202D58;border:2px solid #465B9A;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:inset 0 4px 0 rgba(255,255,255,.035)}
.streak-day-1{--streak:#37BDEB}.streak-day-2{--streak:#A67AF4}.streak-day-3{--streak:#43CE8A}.streak-day-4{--streak:#F0B94C}.streak-day-5{--streak:#ED79B2}.streak-day-6{--streak:#5D9FF4}.streak-day-7{--streak:#F0785F}
.streak-card-top{display:flex;align-items:center;justify-content:space-between;width:100%;gap:3px}
.streak-card-top b{font:10px 'VT323',monospace;color:#fff}
.streak-card-top span{font:10px 'VT323',monospace;color:var(--streak)}
.streak-icon{width:54px;height:48px;display:grid;place-items:center;background:color-mix(in srgb,var(--streak) 18%,#111B3D);border:1px solid color-mix(in srgb,var(--streak) 65%,#26365F)}
.streak-icon canvas{width:42px;height:42px;image-rendering:pixelated}
.streak-reward{font:16px 'VT323',monospace;color:#fff;text-align:center;min-height:18px}
.streak-claim{width:100%;background:#258BDB!important;min-height:30px!important;font-size:15px!important}
.streak-claim:disabled{background:#38516B!important;color:#C9D6E8!important;opacity:1!important}
.streak-state{font:14px 'VT323',monospace;color:#BAC9E8;text-align:center}
.streak-card.is-current{border-color:#FFE078;box-shadow:inset 0 0 0 1px #FFE078,0 0 12px rgba(255,220,95,.15)}
.streak-card.is-past{opacity:.72}
.streak-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding:10px;background:#17264A;border-left:4px solid #46C88C}
.streak-footer b{font:10px 'VT323',monospace;color:#8DE9B4}
.streak-footer span{font:15px 'VT323',monospace;color:#E8F1FF;text-align:right}
.daily-head{background:linear-gradient(110deg,#175E88,#3C4796)!important;border:2px solid #5DBDEB!important}
.daily-task-card{border:2px solid #455D9E!important;background:#202D58!important;box-shadow:inset 4px 0 0 var(--task-accent),0 3px 0 rgba(0,0,0,.18)}
.daily-task-number{font-size:20px!important;min-width:30px!important}
.daily-task-copy b{font-size:19px!important;line-height:1.1!important}
.daily-task-copy small{font-size:16px!important}
.daily-reward{font-size:16px!important;color:#FFE27A!important}
.daily-progress{height:10px!important}
.daily-claim{font-size:16px!important;letter-spacing:.04em}
@media(max-width:370px){.streak-grid{gap:6px}.streak-card{padding:7px}.streak-footer{align-items:flex-start;flex-direction:column}.streak-footer span{text-align:left}}

/* Crate-opening presentation: a reward-showcase scene, not a plain menu */
.mgp.mg-crates{background:radial-gradient(ellipse at 50% 24%,#347DC4 0%,#1B4D91 48%,#102653 100%)!important}
.mg-crates .mgtitle{background:linear-gradient(90deg,#38C9E8,#526FF0,#9564E9)!important;color:#fff!important;border-bottom:3px solid #102653!important}
.mg-crates .crate-intro{text-align:center;padding:7px 10px 2px}
.mg-crates .crate-intro b{display:block;font:12px 'Silkscreen',monospace;color:#FFE47A;text-shadow:0 2px 0 #17345F}
.mg-crates .crate-intro small{display:block;font:18px 'VT323',monospace;color:#EAF5FF;margin-top:4px}
.mg-crates .ctiers{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px!important;margin:8px 0 10px!important}
.mg-crates .ctier{position:relative;min-width:0!important;min-height:82px!important;padding:7px 4px!important;display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:linear-gradient(180deg,#527CB7,#254879)!important;border:2px solid #8BC8F1!important;color:#fff!important;box-shadow:inset 0 3px 0 rgba(255,255,255,.17),0 3px 0 #10264A!important}
.mg-crates .ctier span[data-tic] canvas,.mg-crates .ctier canvas{width:34px!important;height:34px!important}
.mg-crates .ctier b{font:10px 'Silkscreen',monospace!important}
.mg-crates .ctier .ccount{font:17px 'VT323',monospace!important;color:#FFE98B!important}
.mg-crates .ctier .cready{font:9px 'Silkscreen',monospace!important;color:#A9FFCE!important}

  setText($('#coachStep'), 'TUTORIAL ' + (S.tut.step + 1) + '/' + TUT.length); setText($('#coachT'), st.t); setText($('#coachD'), st.d + extra);
  let sel = null;
  if (st.build) {
    if (placing && placing.id === st.build) sel = placing.ghost ? '[data-act="confirmPlace"]' : null;
    else if (sheet === 'build') sel = st.tab && buildTab !== st.tab ? `[data-act="tab"][data-tab="${st.tab}"]` : `[data-act="choose"][data-id="${st.build}"]`;
    else if (!sheet && !mg) sel = '[data-open="build"]';
  } else if (st.act) {
    if (card.classList.contains('show') && sel === null) sel = `#card [data-act="${st.act}"]`;
  } else if (st.nav) sel = mg === st.nav ? (st.nav === 'wheel' ? '#spinBtn' : st.nav === 'dice' ? '#rollBtn' : null) : (mg ? '#mg .mgx' : !sheet ? (st.nav === 'market' ? '#zmkt' : `[data-open="${st.nav}"]`) : null);
  setHL(sel);
}
function setHL(sel) {
  const el = sel ? document.querySelector(sel) : null;
  if (tutHL && tutHL !== el) tutHL.classList.remove('tut-hl');
  if (el) el.classList.add('tut-hl'); tutHL = el;
}
function tutMapTarget() {
  const st = tutStep(); if (!st || S.firstRun) return null;
  if (st.build && placing && placing.id === st.build) { const g = suggestTile(st.build); return g ? { i: g.i, j: g.j, ghost: true } : null; }
  if (st.target) { const t = findId(st.target); return t ? { i: t.i, j: t.j } : null; }
  return null;
}
function drawTutArrow() {
  const tg = tutMapTarget(); if (!tg) return;
  const c = V.ctx, t = performance.now() / 1000;
  if (tg.ghost) { const pulse = .35 + .25 * Math.sin(t * 5); poly(diamond(tg.i, tg.j), `rgba(255,201,60,${pulse})`, '#FFF0A6', 2); }
  const tl = tileAt(tg.i, tg.j); const d = tl ? DEFS[tl.id] : null;
  const top = up(P(tg.i + .5, tg.j + .5), (d && d.h ? d.h * hFac(tl) : 6) * V.z + 46 + Math.round(Math.sin(t * 6) * 4));
  const x = Math.round(top.x), y = Math.round(top.y);
  c.fillStyle = '#0E3A44'; c.fillRect(x - 9, y - 18, 18, 12); c.fillRect(x - 15, y - 6, 30, 3); c.fillRect(x - 12, y - 3, 24, 3); c.fillRect(x - 9, y, 18, 3); c.fillRect(x - 6, y + 3, 12, 3); c.fillRect(x - 3, y + 6, 6, 3);
  c.fillStyle = '#FFC93C'; c.fillRect(x - 6, y - 15, 12, 12); c.fillRect(x - 12, y - 6, 24, 3); c.fillRect(x - 9, y - 3, 18, 3); c.fillRect(x - 6, y, 12, 3); c.fillRect(x - 3, y + 3, 6, 3);
}
function finishTut() { document.body.classList.remove('tut-on');
  S.tut = null; S.tutDone = true; setHL(null); $('#coach').classList.remove('show');
  const reward = grant({ k: 'stars', n: 50 });
  $('#modalBox').innerHTML = `<h2 class="wl-t">Tutorial complete!</h2><p class="wl-s">Your starter city has the essentials: roads, homes, power, water and a working business. You’re ready to grow!</p><ul style="text-align:center"><li>${reward} reward</li></ul><button class="pb wl-r" id="modalOk">Keep building</button>`;
  $('#modal').classList.add('show'); snd('levelup'); confetti(120);
  $('#modalOk').onclick = () => { snd('confirm'); $('#modal').classList.remove('show'); };
  changed();
}
function skipTut() { document.body.classList.remove('tut-on'); S.tut = null; S.tutDone = true; setHL(null); $('#coach').classList.remove('show'); toast('Tutorial skipped. Tap the blue i buttons any time for help.'); changed(); }

/* ================= info popups ================= */
const INFO = {
  dice: ['City Dice', ['Tap ROLL to move around the board.', 'You win whatever tile you land on.', 'Green arrows jump you forward, red arrows push you back.', 'The ??? tile gives a mystery prize.', 'You get a free roll every 30 minutes, and you earn more by collecting from shops, homes and industry.']],
  wheel: ['Lucky Wheel', ['You get one free spin every 12 hours.', 'Wheel tickets give you extra spins.', 'Fill the ticket bar by collecting from your buildings.', 'Every 10 spins wins a free Gold key.']],
  crates: ['Chests', ['Silver, Gold and Diamond chests each need a matching key.', 'Gold and Diamond chests contain stronger rewards.', 'Odds are always shown, and nothing can be bought with real money.', 'Gold and Diamond chests have a guaranteed premium item after a set number of opens.']],
  market: ['Dosh Shop', ['New stock every Monday.', 'Each item has limited stock for the week.', 'Spend Dosh, the green notes you earn from tasks, dice, the wheel and crates.', 'Buildings you buy go to Build, My items.']],
  build: ['Building', ['Everything needs a road next to it.', 'Most buildings need power and water too: build a Wind Turbine and a Water Tower.', 'Shops need workers, so build homes to bring people in.', 'Tap any building to upgrade it. Levels 4 and 5 need Deeds.']],
  tasks: ['Tasks', ['Finish tasks to win dice, tickets, keys, crates, Dosh and Deeds.', 'When you claim one, a new task appears.', 'Upgrading buildings, restocking and collecting all count.']],
  hall: ['Town Hall', ['Expand your land here once you reach the right level.', 'Expanding costs Coins and Deeds.', 'Power and water show how much your city makes and uses.', 'Workers come from homes, and businesses need them to run.']]
};
function showInfo(k) {
  const it = INFO[k]; if (!it) return;
  $('#modalBox').innerHTML = `<h2>${it[0]}</h2><p class="note" style="color:#FFE066!important">How it works</p><ul style="text-align:left">${it[1].map((x, n) => `<li>${n + 1}. ${x}</li>`).join('')}</ul><button class="pb" id="modalOk">Got it</button>`;
  $('#modal').classList.add('show'); $('#modalOk').focus(); $('#modalOk').onclick = () => { snd('confirm'); $('#modal').classList.remove('show'); };
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button'); if (!b || b.disabled) return;
  setTimeout(() => { if (!lastSnd._any || performance.now() - lastSnd._any > 60) snd('tap'); }, 0);
}, true);
/* ================= toast + modal ================= */
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function showLevel() {
  if (!pendingLevel) return; const p = pendingLevel; pendingLevel = null;
  $('#modalBox').innerHTML = `<h2>Level ${p.level}!</h2><p class="note">${stage(p.level)} · keep growing Bit-Burbs</p><ul>${p.labels.map(l => `<li>${l}</li>`).join('')}</ul>${p.unlocks.length ? `<p class="note" style="font-weight:700">New to build: ${p.unlocks.join(', ')}</p>` : ''}<button class="pb" id="modalOk">Nice!</button>`;
  $('#modal').classList.add('show'); $('#modalOk').focus(); $('#modalOk').onclick = () => { snd('confirm'); $('#modal').classList.remove('show'); };
}
function welcome(upgraded) {
  const bonus = !S.welcomeBonus;
  $('#modalBox').innerHTML = `<h2 class="wl-t">${upgraded ? 'Bit-Burbs is here!' : 'Welcome to Bit-Burbs'}</h2><p class="wl-s">${upgraded ? 'A fresh new look, upgrades and Deeds.' : 'Your city is waiting, Mayor.'}</p>` + (bonus
    ? `<p class="wl-s">Here’s a welcome gift to get you started.</p><div class="wl-row"><span class="px-r"><span class="wl-chip"><canvas data-icon="dosh" width="56" height="56" style="width:22px;height:22px" aria-hidden="true"></canvas><span>+50</span></span></span><button class="pb wl-r" id="modalOk">Redeem</button></div>`
    : `<button class="pb" id="modalOk">Let’s build</button>`);
  $('#modal').classList.add('show'); paintNewIcons();
  $('#modalOk').onclick = () => {
    $('#modal').classList.remove('show'); S.firstRun = false; S.upgraded = false;
    if (bonus) { S.welcomeBonus = true; S.stars += 50; snd('coins'); toast('+50 Dosh added. Enjoy, Mayor!'); } else snd('confirm');
    changed(); save();
  };
}

/* ================= map buttons ================= */
$('#zmkt').addEventListener('click', () => { placing = null; if (sheet) closeSheet(); openMg('market'); });
document.querySelector('.chip[aria-label="Dosh"]').addEventListener('click', () => { placing = null; if (sheet) closeSheet(); openMg('market'); });
$('#clock').style.cursor = 'pointer';
$('#clock').addEventListener('click', () => { const tm = SK.times || {}; const f = x => x ? new Date(x).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '—'; toast('Sunrise ' + f(tm.rise) + ' · Sunset ' + f(tm.set) + (LOC.src === 'gps' ? ' · your location' : ' · tap Tasks to use your location')); });
$('#coachSkip').addEventListener('click', skipTut);
$('#rsAll').addEventListener('click', () => restockAll());
const COMPASS = ['N', 'E', 'S', 'W'];
let rotBusy = false;
$('#zrot').addEventListener('click', () => {
  if (rotBusy) return; rotBusy = true; snd('tab');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const doRot = () => { const mid = screenToWorld(W / 2, mapMidY()); ROT = (ROT + 1) % 4; centerOn(mid.x, mid.y); clampCam(); setText($('#rotLbl'), COMPASS[ROT]); };
  if (reduce) { doRot(); rotBusy = false; return; }
  cv.classList.remove('flip'); void cv.offsetWidth; cv.classList.add('flip');
  setTimeout(doRot, 170); setTimeout(() => { cv.classList.remove('flip'); rotBusy = false; }, 360);
});
$('#zin').addEventListener('click', () => snapZoom(W / 2, mapMidY(), 1));
$('#zout').addEventListener('click', () => snapZoom(W / 2, mapMidY(), -1));
$('#zhome').addEventListener('click', () => { const h = findHall(); if (h) animateTo(h.i + .5, h.j + .5); });

/* ================= loop ================= */
let dirty = false;
function changed() { dirty = true; }
let last = performance.now(), uiAcc = 0, saveAcc = 0, skyAcc = 99;
function frame(t) {
  const dt = Math.min(.1, (t - last) / 1000); last = t;
  if (camAnim) { const e = Math.min(1, (t - camAnim.t0) / 450); const k = 1 - Math.pow(1 - e, 3); V.cx = camAnim.sx + (camAnim.tx - camAnim.sx) * k; V.cy = camAnim.sy + (camAnim.ty - camAnim.sy) * k; if (e >= 1) camAnim = null; }
  skyAcc += dt; if (skyAcc > 10) { skyAcc = 0; updateSky(); }
  tick(dt);
  pumpRewardPopup();
  render();
  if (mg === 'dice') drawBoard(); else if (mg === 'wheel') drawWheel(); else if (mg === 'crates') drawChestScene();
  drawFx();
  uiAcc += dt;
  if (uiAcc > .25 || dirty) { uiAcc = 0; paintNewIcons(); updateHUD(); tutTick(); checkDaily(); showDaily(); renderCard(false); renderSheet(false); updateDiceUI(); updateWheelUI(); updateCrateUI(); updateMarketUI(); if (pendingLevel && !$('#modal').classList.contains('show')) showLevel(); }
  saveAcc += dt; if (saveAcc > 5 || (dirty && saveAcc > 1)) { saveAcc = 0; dirty = false; save(); }
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
S = load() || newGame();
if (S.tut && !S.tutDone) {
  const oldStep = Math.max(0, S.tut.step || 0);
  const oldToNew = [0, 1, 2, 2, 3, 4, 5, 6, 7, 8, 9];
  S.tut.step = oldStep >= 11 ? TUT.length : (oldToNew[oldStep] ?? TUT.length);
  S.tut.ev = {}; S.tut.started = false;
}
if (S.loginClaimDay == null) S.loginClaimDay = -1;
if (S.tiles && S.tiles.length !== N * N) { const oN = Math.round(Math.sqrt(S.tiles.length)), off = Math.floor((N - oN) / 2), nt = Array(N * N).fill(null); for (let j = 0; j < oN; j++) for (let i = 0; i < oN; i++) { const t = S.tiles[j * oN + i]; if (!t) continue; if (t.id === '_occ' && t.ref) t.ref = [t.ref[0] + off, t.ref[1] + off]; nt[(j + off) * N + i + off] = t; } S.tiles = nt; }
if (!S.crates) S.crates = { steel: 0, gold: 0, diamond: 0 };
if (S.crates.wood > 0) { S.keys.steel = (S.keys.steel || 0) + S.crates.wood; S.crates.wood = 0; }
for (const k of ['steel', 'gold', 'diamond']) { if (S.crates[k] > 0) { S.keys[k] = (S.keys[k] || 0) + S.crates[k]; S.crates[k] = 0; } }
S.crates = { steel: 0, gold: 0, diamond: 0 };
if (!S.grind) S.grind = { d: 0, t: 0 };
if (S.dice > 15) S.dice = 15;
S.dicePos = (S.dicePos || 0) % 12;
S.items = Object.assign({ fountain: 0, statue: 0, flowers: 0, sakura: 0, ferris: 0 }, S.items || {});
if (!S.market) S.market = { week: 0, bought: {}, seen: 0 };
(function catchUp() {
  const el = Math.max(0, now() - (S.saved || now()));
  if (el > 10000) {
    derive(); S.pop = Math.min(D.cap, S.pop + Math.min(20, Math.floor(el / 45000)) * 2);
    const to = now(), from = to - Math.min(el, 12 * 3600e3); const got = bizOffline(from, to); S.cash += got;
    if (el > 60000 && !S.upgraded && got > 0) setTimeout(() => toast('Welcome back! Your businesses earned ' + fmt(got) + ' Coins while you were away.'), 600);
  }
  S.busT = Math.max(S.busT || 0, now() + 8000);
})();
updateSky(true);
if (LOC.src !== 'gps') askLocation(false);
addEventListener('resize', () => { resize(); clampCam(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else updateSky(); });
resize(); derive(); centerOn(MID, MID); paintStaticIcons(); updateHUD();
if (S.upgraded) welcome(true); else if (S.firstRun) welcome(false);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { resize(); paintStaticIcons(); lastClockKind = ''; lastFace = -1; });
requestAnimationFrame(frame);
})();
</script>

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {})); }
