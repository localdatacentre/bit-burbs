<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bit-Burbs — Build Your Block</title>
<meta name="theme-color" content="#172320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="bitburbs-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Anton&family=VT323&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Legacy renderer styles isolated; new design is in pocket-ui.css. */
@layer legacy {

:root{
  --ink:#0B0E13; --cream:#F2F5F8; --muted:#9AA6B4;
  --ui:#1C222B; --ui-deep:#12161C; --ui-hi:#2A323D; --ui-row:#1F262F; --ui-row2:#262E38;
  --tan:#E9EDF2; --tan-hi:#FFFFFF; --tan-lo:#C5CDD6;
  --gold:#2F6FEB; --red:#C9434A; --teal:#6FA8FF; --green:#2F6FEB; --magenta:#2F6FEB; --blue:#2F6FEB; --sky:#6FA8FF; --navy:#16325C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --ui:#1A2028; --ui-deep:#101418; }
}
:root[data-theme="dark"]{ color-scheme:dark; --ui:#1A2028; --ui-deep:#101418; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;overflow:hidden;background:#0B1030}
body{font-family:'Oswald',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--cream);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ui-deep)}
button{font:inherit}
button:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated;filter:saturate(1.12) contrast(1.05) brightness(1.03)}

/* pixel buttons */
.pb{font-weight:600;font-size:16px;letter-spacing:.02em;min-height:44px;padding:0 14px;border:1px solid rgba(255,255,255,.07);border-radius:10px;color:#FFFFFF;cursor:pointer;background:linear-gradient(#4A84F2,#2F6FEB);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.22);display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.1;text-transform:none}
.pb:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.25),0 1px 0 var(--ink)}
.pb.red{background:linear-gradient(#D65A60,#C9434A);color:#FFFFFF}.pb.teal{background:linear-gradient(#8DBBFF,#6FA8FF);color:var(--ink)}.pb.green{background:linear-gradient(#4A84F2,#2F6FEB);color:#FFFFFF}.pb.purple{background:linear-gradient(#36404D,#2A323D);color:var(--cream)}.pb.cream{background:linear-gradient(#FFFFFF,#E3E8EE);color:var(--ink)}
.pb[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.pb.sm{font-size:13px;padding:0 10px}
.sq{width:44px;height:44px;padding:0;font-size:20px}

/* HUD */
#hud{border-bottom:0;box-shadow:0 4px 18px rgba(0,0,0,.35);position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;background:linear-gradient(var(--ui-hi),var(--ui) 40%,var(--ui-deep));border-bottom:1px solid rgba(255,255,255,.07);box-shadow:0 0 0 transparent;display:flex;flex-direction:column;gap:7px}
.hrow{display:flex;align-items:center;gap:8px}
.lvl{border:0;border-radius:12px;width:40px;height:40px;border-radius:8px;background:linear-gradient(#4A84F2,#2F6FEB);border:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#FFFFFF;flex-shrink:0;}
.cname{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cname b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cname b small{font-weight:500;font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:.04em}
.cname b.wm{letter-spacing:.14em;font-size:15px;font-weight:700}
.xp{height:6px;border-radius:99px;border:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.07);border-radius:4px;background:var(--ui-deep);overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(#8DBBFF,#2F6FEB)}
#clock{border:0;background:rgba(255,255,255,.06);border-radius:10px;display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600;background:rgba(8,16,26,.45);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:4px 7px;white-space:nowrap}
#boost{font-weight:700;font-size:12px;background:var(--blue);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:3px 6px;white-space:nowrap}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.chip{display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(255,255,255,.06);border-radius:10px;border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:4px 3px;font-weight:600;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip canvas{flex-shrink:0}

/* advisor */
#advisor{position:fixed;left:8px;z-index:15;display:flex;align-items:center;gap:8px;max-width:200px;background:linear-gradient(var(--ui-hi),var(--ui));color:var(--cream);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:6px 10px 6px 6px;cursor:pointer;text-align:left;;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#advisor:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#advisor canvas{flex-shrink:0}
#advisor .adv{display:flex;flex-direction:column;min-width:0}
#advisor b{font-size:14px;font-weight:600;line-height:1.15}
#advisor small{font-size:12px;font-weight:500;color:var(--muted);line-height:1.2}
#advisor.warn{background:linear-gradient(#7A3238,#5A2328)}
#advisor.warn small{color:#FFE3D6}
#mapctl{position:fixed;right:8px;z-index:15;display:flex;flex-direction:column;gap:8px}
#legend{border:0;border-radius:10px;position:fixed;left:50%;transform:translateX(-50%);z-index:15;background:rgba(30,26,71,.92);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;display:none;white-space:nowrap}
#legend.show{display:block}

/* nav */
#nav{border-top:0;box-shadow:0 -4px 18px rgba(0,0,0,.35);position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);background:linear-gradient(var(--ui),var(--ui-deep));border-top:1px solid rgba(255,255,255,.07);box-shadow:0 0 0 transparent;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
#nav .pb{flex-direction:column;gap:3px;min-height:58px;font-size:12px;position:relative;padding:4px 0;letter-spacing:0}
.dot{border:0;position:absolute;top:-9px;right:-5px;min-width:22px;height:22px;border-radius:11px;background:#FFFFFF;color:var(--ink);border:1px solid rgba(255,255,255,.07);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}
.dot[hidden]{display:none}

/* info card */
#card{position:fixed;left:8px;right:8px;z-index:18;padding:12px;display:none;flex-direction:column;gap:10px;max-width:520px;margin:0 auto;background:linear-gradient(var(--ui-hi),var(--ui) 30%);border:1px solid rgba(255,255,255,.07);border-radius:8px;;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#card.show{display:flex;overflow-y:auto;overscroll-behavior:contain}
.chead{display:flex;align-items:flex-start;gap:10px}
.chead h2{margin:0;font-size:20px;line-height:1.1}
.chead p{margin:3px 0 0;font-size:14px;font-weight:500;color:var(--muted)}
.chead .x{margin-left:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .pb{flex:1}
.bar{height:10px;border-radius:99px;border:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.07);border-radius:4px;background:var(--ui-deep);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#8DBBFF,#2F6FEB);width:0}
.tags{display:flex;flex-wrap:wrap;gap:5px;font-size:13px;font-weight:600}
.tag{border:0;border-radius:6px;background:var(--ui-deep);border:1px solid rgba(255,255,255,.07);border-radius:5px;padding:2px 7px}
.tag.ok{background:#1F4E8C}.tag.bad{background:#6E2A30}
.note{font-size:14px;font-weight:500;margin:0;color:var(--cream)}

/* sheets */
#scrim{position:fixed;inset:0;z-index:30;background:rgba(6,12,20,.55);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{border:0;border-radius:18px 18px 0 0;position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:84%;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.07);border-bottom:none;border-radius:10px 10px 0 0;background:linear-gradient(var(--ui-hi),var(--ui) 60px);box-shadow:inset 0 0 0 2px rgba(111,168,255,.4);transform:translateY(105%);transition:transform .25s ease;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.open{transform:none}
.shead{display:flex;align-items:center;gap:10px;padding:12px 12px 8px}
.shead h2{margin:0;font-size:22px;flex:1;color:#FFFFFF;letter-spacing:.04em;text-transform:uppercase}
.sbody{overflow-y:auto;padding:0 12px 16px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs .pb{flex:0 0 auto;font-size:12px;padding:0 10px}
.tabs .pb[aria-pressed="false"]{background:var(--ui-deep);color:var(--cream)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bcard{border:1px solid rgba(0,0,0,.06);border-radius:14px;border:1px solid rgba(255,255,255,.07);border-radius:8px;background:linear-gradient(var(--tan-hi),var(--tan));padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink);text-align:center;box-shadow:none}
.bcard canvas{width:110px;height:92px}
.bcard b{font-size:15px}
.bcard span{font-size:12px;font-weight:500}
.bcard .price{font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px}
.bcard[aria-disabled="true"]{filter:grayscale(.7);opacity:.6;cursor:not-allowed}
.sect{border:0;border-radius:14px;border:1px solid rgba(255,255,255,.07);border-radius:8px;background:var(--ui-deep);padding:10px;display:flex;flex-direction:column;gap:8px}
.sect h3{margin:0;font-size:14px;color:var(--sky);letter-spacing:.06em;text-transform:uppercase}
.task{display:flex;align-items:center;gap:10px}
.task .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.task .info small{font-weight:500;font-size:13px;color:var(--muted)}

/* mini-game modal */
#mg{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(6,12,20,.7);padding:calc(env(safe-area-inset-top,0px) + 10px) 8px calc(env(safe-area-inset-bottom,0px) + 10px)}
#mg.show{display:flex}
.mgp{border:0;border-radius:18px;position:relative;width:min(420px,100%);max-height:100%;overflow-y:auto;border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:14px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.mgp.tan{background:linear-gradient(var(--tan-hi),var(--tan) 50px);color:var(--ink);box-shadow:,inset 0 0 0 3px var(--tan-lo)}
.mgp.purple{background:radial-gradient(circle at 50% 25%,#2A323D,#1C222B 60%,#12161C);color:var(--cream)}
.mgtitle{font-size:22px;font-weight:700;color:#FFFFFF;margin:0;letter-spacing:.12em}
.mgp.tan .mgtitle{color:var(--ink)}
.mgx{position:absolute;top:8px;right:8px}
.mgcanvas{display:block;max-width:100%}
.bigdie{border:0;border-radius:16px;width:76px;height:76px;background:linear-gradient(#FFFFFF,#D5DCE4);border:1px solid rgba(255,255,255,.07);border-radius:10px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;gap:4px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.bigdie i{border-radius:2px}
.bigdie i.on{background:var(--ink)}
.bigdie.tumble{animation:tumble .12s linear infinite}
@keyframes tumble{0%{transform:rotate(-12deg) translateY(-6px)}50%{transform:rotate(12deg) translateY(2px)}100%{transform:rotate(-12deg) translateY(-6px)}}
.cnt{background:rgba(11,14,19,.12);border:1px solid rgba(255,255,255,.07);border-radius:4px;padding:2px 10px;font-weight:700;font-size:16px}
.mgmsg{font-size:15px;font-weight:600;text-align:center;min-height:20px;margin:0}
.ptable{border:0;border-radius:12px;width:100%;border:1px solid rgba(255,255,255,.07);border-radius:4px;overflow:hidden;color:var(--cream)}
.ptable .ph{background:var(--magenta);padding:6px 10px;font-weight:700;font-size:16px;text-shadow:0 2px 0 var(--ink)}
.ptable .pr{display:flex;align-items:center;gap:8px;padding:5px 10px;font-weight:600;font-size:15px;background:var(--ui-row)}
.ptable .pr:nth-child(odd){background:var(--ui-row2)}
.ptable .pr span{flex:1}
.ptable .pr canvas{flex-shrink:0}
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.tier{border-radius:12px;border:1px solid rgba(255,255,255,.07);border-radius:6px;background:var(--ui-deep);color:var(--cream);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:600;font-size:14px;min-height:96px}
.tier[aria-pressed="true"]{background:linear-gradient(#4A84F2,#2F6FEB);color:#FFFFFF}
.tier small{font-weight:500;font-size:12px}
.pips{border:0;border-radius:12px;display:flex;gap:4px;align-items:center;width:100%;background:linear-gradient(#2A323D,#1C222B);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:8px}
.pips i{border:0;flex:1;height:22px;border:1px solid rgba(255,255,255,.07);border-radius:4px;background:#12161C}
.pips i.on{background:linear-gradient(#8DBBFF,#2F6FEB)}
.pips canvas{flex-shrink:0;margin-left:4px}

.grind{display:flex;align-items:center;gap:8px;width:100%;font-size:14px;font-weight:600}
.grind .bar{flex:1}
.grind b{min-width:44px;text-align:right}
.mgp.tan .bar,.bcard .bar{background:rgba(11,14,19,.1)}
/* star market */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.mcard{border:1px solid rgba(0,0,0,.06);border-radius:14px;border:1px solid rgba(255,255,255,.07);border-radius:8px;background:linear-gradient(var(--tan-hi),var(--tan));color:var(--ink);padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:none}
.mcard.feat{grid-column:1/-1;flex-direction:row;text-align:left;background:linear-gradient(#FFFFFF,#DCE6F5);box-shadow:none}
.minfo{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;width:100%}
.mcard em{font-style:normal;font-size:12px;font-weight:600;color:#2F6FEB;letter-spacing:.04em;text-transform:uppercase}
.mcard b{font-size:16px}
.mcard span{font-size:13px;font-weight:500}
.mcard .mleft{font-size:12px;font-weight:600;color:#5A6676}
.mcard .pb{margin-top:auto;font-size:16px;text-transform:none}
.chip[aria-label="Dosh"]{cursor:pointer}
/* toast + modal */
#toast{position:fixed;left:50%;z-index:60;transform:translate(-50%,-10px);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;background:var(--ui-deep);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:8px 14px;font-weight:700;font-size:15px;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(6,12,20,.65);padding:20px}
#modal.show{display:flex}
#modalBox{padding:18px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center;background:radial-gradient(circle at 50% 20%,#2A323D,#1C222B 70%);border:1px solid rgba(255,255,255,.07);border-radius:8px;;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#modalBox h2{margin:0;font-size:24px;color:#FFFFFF;letter-spacing:.06em}
#modalBox ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
@media (prefers-reduced-motion: reduce){
  #sheet,#toast{transition:none}
  .bigdie.tumble{animation:none}
}

/* ===== modern glass UI ===== */
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif}
.pb{background:#0A84FF;color:#FFFFFF;border:0;box-shadow:none;border-radius:12px;font-weight:600;letter-spacing:0;text-transform:none;font-family:inherit}
.pb:active{transform:scale(.97);filter:brightness(.92)}
.pb.green{background:#0A84FF}
.pb.purple,.pb.teal{background:rgba(255,255,255,.1);color:#F2F5F8}
.pb.cream{background:rgba(255,255,255,.1);color:#F2F5F8}
.pb.red{background:rgba(255,69,58,.9);color:#FFFFFF}
.pb.sq{border-radius:50%;background:rgba(22,26,32,.72);color:#F2F5F8;backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.08)}
#zmkt{color:#FFD60A}
.mgx,.chead .x,.shead .pb{background:rgba(255,255,255,.12);border-radius:50%;border:0;width:36px;height:36px;min-height:36px;font-size:15px;backdrop-filter:none}
#hud,#nav{background:rgba(14,17,22,.78);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:none}
#hud{border-bottom:1px solid rgba(255,255,255,.06)}
#nav{border-top:1px solid rgba(255,255,255,.06);gap:0;padding-top:6px}
#nav .pb{background:transparent;color:#8E98A6;min-height:52px;font-size:11px;font-weight:500;border-radius:10px}
#nav .pb svg{width:24px;height:24px}
#nav .pb[data-open="build"]{color:#0A84FF}
.dot{background:#FF453A;color:#FFFFFF;border-radius:10px;top:-2px;right:14%;min-width:18px;height:18px;font-size:11px}
.chip{background:transparent;border:0;font-weight:600;font-size:15px;color:#F2F5F8;gap:5px}
.chip svg{width:17px;height:17px;color:#8E98A6;flex-shrink:0}
.lvl{background:transparent;border:1.5px solid rgba(255,255,255,.25);border-radius:50%;width:34px;height:34px;font-size:15px;color:#FFFFFF}
.cname b.wm{font-size:14px;letter-spacing:.16em;font-weight:600}
.xp i,.bar i{background:#0A84FF}
#clock{font-weight:500;font-size:13px}
#card,#sheet,.mgp,#modalBox,#advisor,#toast,#legend{background:rgba(22,26,32,.84);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,.08);color:#F2F5F8}
.mgp.tan{color:#F2F5F8}
.mgp.tan .mgtitle,.mgtitle{color:#FFFFFF;font-size:17px;font-weight:600;letter-spacing:.02em}
.shead h2{font-size:17px;letter-spacing:.02em;text-transform:none;font-weight:600}
.sect h3{color:#8E98A6;font-size:12px;font-weight:600}
#advisor{border-radius:14px}
#advisor.warn{background:rgba(120,30,30,.72)}
#advisor b{font-weight:600}
.bcard,.mcard{background:rgba(255,255,255,.06);color:#F2F5F8;border:1px solid rgba(255,255,255,.06)}
.mcard.feat{background:rgba(10,132,255,.14);border-color:rgba(10,132,255,.35)}
.mcard em{color:#64A8FF}.mcard .mleft{color:#8E98A6}
.bcard span,.mcard span{color:#B8C2CE}
.sect,.tier,.pips,.cnt{background:rgba(255,255,255,.06);color:#F2F5F8;border:0}
.tier[aria-pressed="true"]{background:#0A84FF;color:#FFFFFF}
.ptable{background:transparent}
.ptable .ph{background:rgba(255,255,255,.08);text-shadow:none;font-size:13px;font-weight:600;letter-spacing:.04em;color:#8E98A6}

<style id="bb-nav-visibility-guard">
/* Emergency baseline for mobile/WebKit: nav must render even if an offline

 height:auto!important;min-height:0!important;max-height:none!important;
 transform:none!important;translate:none!important;
 visibility:visible!important;opacity:1!important;
 pointer-events:auto!important;
 z-index:20!important;
 grid-template-columns:repeat(5,minmax(0,1fr))!important;
 align-items:stretch!important;justify-content:stretch!important;

 box-sizing:border-box!important;
}
#nav > button.pixel-btn[data-open]{

 align-items:center!important;justify-content:center!important;
 width:100%!important;min-width:0!important;
 height:36px!important;min-height:36px!important;
 margin:0!important;padding:2px!important;gap:4px!important;
 visibility:visible!important;opacity:1!important;

 background:var(--bb-face,#1CA8DB)!important;

<style id="bb-sheet-dock-fix">
/* v75: sheet must not appear on startup; the dock stays above regular sheets.
   The existing JavaScript .open toggle is the only way to show this panel. */
#sheet:not(.open){
 display:none!important;visibility:hidden!important;
 pointer-events:none!important;transform:none!important;
}
#sheet.open{
 display:flex!important;visibility:visible!important;
 pointer-events:auto!important;transform:none!important;
 position:fixed!important;
 top:0!important;left:0!important;right:0!important;
 bottom:calc(46px + env(safe-area-inset-bottom,0px))!important;
 height:auto!important;max-height:none!important;
 max-width:none!important;margin:0!important;
 overflow:hidden!important;z-index:31!important;
}
#sheet.open .sbody{min-height:0!important;flex:1 1 auto!important;overflow-y:auto!important}
#nav{

 z-index:35!important;
}
#scrim{z-index:30!important}

#mg #mgPanel.mg-crates .crate-shelf{width:100%;gap:4px}
#mg #mgPanel.mg-crates .crate-slot{box-sizing:border-box;position:relative;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;align-content:center;justify-content:center;align-items:center;column-gap:5px;row-gap:2px;min-height:57px;padding:4px 1px!important;border:0!important;border-bottom:3px solid #211e48!important;background:#494570!important;box-shadow:none!important}
#mg #mgPanel.mg-crates .crate-slot canvas{grid-row:span 2;width:26px!important;height:26px!important}
#mg #mgPanel.mg-crates .crate-slot b,#mg #mgPanel.mg-crates .crate-count{justify-self:start}
#mg #mgPanel.mg-crates .crate-slot b{font-size:19px}
#mg #mgPanel.mg-crates .crate-slot[aria-pressed=true]{background:#5b5590!important;border-bottom-color:var(--cargo)!important}
#mg #mgPanel.mg-crates .crate-count{font-size:15px;color:#e1ddf6}
#mg #mgPanel.mg-crates .crate-bonus{width:100%;box-sizing:border-box;padding:9px 10px;background:#494570;color:#eddab3}
#mg #mgPanel.mg-crates .crate-bonus progress{height:8px}
#mg #mgPanel.mg-crates .crate-feature #openBtn{margin:0!important;min-height:44px!important}
#mg #mgPanel.mg-crates .odds{box-sizing:border-box;background:#494570;color:#edf1e8;border-color:#211e48}
#mgPanel.mg-crates .crate-notice{display:flex;align-items:center;justify-content:center;gap:8px;min-height:32px;color:#fff2cd;font:22px/1.1 'VT323',monospace}
#mgPanel.mg-crates .crate-notice:empty{display:flex}
#mgPanel.mg-crates .crate-notice.reward-in{animation:crateRewardIn .18s ease-out}
#mgPanel .wheel-rewards{box-sizing:border-box;width:100%;padding:0 12px;background:#343053;color:#fff5df;border:2px solid #665e84;text-align:left}
.wheel-goal{--fill:#fa889f;display:grid;grid-template-columns:28px 1fr auto;gap:2px 9px;align-items:center;padding:8px 0;font:18px/1 'VT323',monospace}
.wheel-goal + .wheel-goal{--fill:#f6c753;border-top:2px solid #524b70}
.wheel-goal span{grid-row:span 3;justify-self:center}
.wheel-goal strong{grid-column:2}.wheel-goal b{grid-column:3;grid-row:1;color:var(--fill)}
.wheel-goal small{grid-column:2/-1;grid-row:2;font-size:15px;color:#ded8ec}
.wheel-goal progress{grid-column:2/-1;grid-row:3;width:100%;appearance:none;height:6px;border:0;background:#201d38;margin-top:2px}
.wheel-goal progress::-webkit-progress-bar{background:#201d38}.wheel-goal progress::-webkit-progress-value{background:var(--fill)}.wheel-goal progress::-moz-progress-bar{background:var(--fill)}

<script>
const SPRK=(function(){let NO_SKIRT=true;
/* ===== Bit-Burbs model kit v2: crisp iso pixel renderer with painter sorting ===== */
let OX=40,OY=76,FX=1,FY=1,SC=2;
const R=Math.floor;
function sh(h,f){const n=parseInt(h.slice(1),16);return'#'+[n>>16,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*f))).toString(16).padStart(2,'0')).join('');}
function mix(a,b,t){const A=parseInt(a.slice(1),16),Bn=parseInt(b.slice(1),16);return'#'+[16,8,0].map(s=>Math.round(((A>>s)&255)*(1-t)+((Bn>>s)&255)*t).toString(16).padStart(2,'0')).join('');}
const INK='#2A2440';
// Hand-pixelled foliage. Tree crowns, flower heads and bark share the model's integer pixel grid.
const plantPixels = {};
function nativeSprite(kind) {
 if (plantPixels[kind]) return plantPixels[kind];
 const tile = document.createElement('canvas');
 tile.width = 42; tile.height = 42;
 const ctx = tile.getContext('2d');
 const ink = (x,y,color,w=1,h=1) => {
  ctx.fillStyle = color;
  ctx.fillRect(x,y,w,h);
 };
 const stamp = (x,y,rows,palette,flip=false) => {
  for (let row=0;row<rows.length;row++) for (let col=0;col<rows[row].length;col++) {
   const color=palette[rows[row][col]];
   if (color) ink(x+(flip?rows[row].length-1-col:col),y+row,color);
  }
 };
 const twig = (points,color,width=1) => {
  for (let i=1;i<points.length;i++) {
   const [x,y]=points[i-1], [u,v]=points[i];
   const steps=Math.max(Math.abs(u-x),Math.abs(v-y),1);
   for(let n=0;n<=steps;n++) ink(Math.round(x+(u-x)*n/steps),Math.round(y+(v-y)*n/steps),color,width,width);
  }
 };
 const gumLeaves=['.....hhmm....','...hhhhhmm...','..hllhhllmmm.','.hllllmmmllm.',
 'lllmlmmmmmmdd','.lmmllmmmddd.','.llmmmddmddd.','..mmmd..ddd..','..md....dd...','..d.....d....'];
 const sprays=['....hhll...','..hhllllm..','.hhllmmlmm.','hllllhllmmm','.lmlmmlmmmd',
 '.lmmmmlmddd','..mmmdmddd.','...md..dd..'];
 const wattleLeaves=['....lllll....','..llhhllllm..','.lhhhhlllmml.','llhhllmlmmmml',
 '.llllllmmlmmm','..llllmmmmddd','.lmmmlmdddmd.','..mdmmddd.d..','..d..mm......'];
 const leaves={
  gum:{h:'#ACBF96',l:'#89AA8B',m:'#608A79',d:'#406B62'},
  flowering:{h:'#8BAC85',l:'#709677',m:'#507B67',d:'#365E55'},
  wattle:{h:'#99B57A',l:'#78A06A',m:'#567D55',d:'#3C674D'}
 };
 if(kind==='gum'||kind==='flowering'){
  // A gum opens out below the crown: three different branch angles and exposed pale bark.
  const bloom=kind==='flowering', pal=bloom?leaves.flowering:leaves.gum;
  const bark=bloom?'#735F50':'#9A8872', lit=bloom?'#AC8D71':'#DDD2AF';
  twig([[19,39],[20,33],[18,28],[19,23],[16,19],[15,13]],bark,3);
  twig([[20,30],[25,24],[29,20],[31,15]],bark,2);
  twig([[19,27],[15,24],[10,22],[7,17]],bark,2);
  twig([[19,24],[21,20],[23,15],[22,9]],bark,2);
  twig([[20,39],[21,34],[19,28],[20,24]],lit);
  twig([[20,29],[24,25],[29,21]],lit);
  twig([[18,26],[14,24],[10,23]],lit);
  ink(20,36,bark,2); ink(20,30,'#C1AB8A',2); ink(18,40,bark,6);
  const clusters=bloom?[[2,14],[9,7],[18,5],[24,11],[27,17],[11,15],[16,11]]:
   [[2,14],[8,8],[16,3],[25,9],[27,14],[12,14]];
  for (let i=0;i<clusters.length;i++) {
   const [x,y]=clusters[i];stamp(x,y,gumLeaves,pal,i===4);
  }
  if (bloom) {
   const flowers=['.a.b.','abbaa','.ccbc','..gg.'];
   const p={a:'#EFAC92',b:'#DE8079',c:'#B85B64',g:pal.d};
   for(const [x,y] of [[3,17],[8,13],[11,9],[18,7],[25,9],[30,13],[32,19],[20,15],[14,18]]) stamp(x,y,flowers,p);
  }
 }else if(kind==='wattle'){
  const pal=leaves.wattle, stems='#8A7760', light='#B7A082';
  twig([[20,39],[19,32],[20,28],[17,23],[15,14]],stems,2);
  twig([[19,34],[15,28],[10,23],[7,17]],stems,2);
  twig([[20,30],[25,25],[29,18]],stems,2);
  twig([[19,26],[22,20],[23,12]],stems,2);
  twig([[20,39],[20,34],[19,31]],light);ink(18,40,stems,5);
  for(const [x,y] of [[2,17],[6,11],[12,6],[18,8],[24,12],[26,18],[16,17],[9,19]])stamp(x,y,wattleLeaves,pal);
  const spraysOfGold=['.hl..','hgg.g','.sdhl','..g.s'];
  for(const [x,y] of [[3,19],[8,13],[13,9],[20,11],[27,16],[30,22],[17,20],[11,24]]) {
   stamp(x,y,spraysOfGold,{h:'#FFE38B',l:'#F7D368',g:'#EAB648',s:'#C1923D',d:pal.m});
  }
 }else if(kind==='lime'){
  const pal={h:'#9AB369',l:'#759855',m:'#537D4B',d:'#376341'};
  twig([[20,39],[20,34],[17,30],[14,25]],'#876C4C',2);
  twig([[20,34],[24,30],[27,25]],'#917753',2);
  for(const [x,y] of [[8,23],[13,17],[19,18],[23,23],[15,25]])stamp(x,y,sprays,pal);
  for(const [x,y] of [[11,27],[17,22],[28,25],[22,29]])stamp(x,y,['.g','ph','pb','b.'],{g:pal.d,p:'#D79C79',h:'#E9B38C',b:'#AD715E'});
  ink(20,36,'#B09871',1,4);
 }else{
  const shrubs = {
   banksia:{p:{h:'#ACC19A',l:'#83A189',m:'#5D806B',d:'#3E6655',a:'#E8C186',b:'#C69A60',s:'#997443'},
    rows:['...ab.....h....','..aabb...hl..a.','..aba...hhl.ab.','l..sb.h.lll.bb.','hllslhl.llmsbhl','.lllhlmlmllsll.','..llmmlllmlmll.',

 const ctx=k.ctx, pixels=rows[0].length, topOffset=height*SC;
 for(let sx=Math.ceil(a.x);sx<Math.ceil(end.x);sx++){
  const u=(sx+.5-a.x)/(end.x-a.x), bottom=Math.floor(a.y+(end.y-a.y)*u);

let walkingGraph = null, walkingKerbs=null, nextWalkerIn = .3;
let walkingDestinations=[];
const walkers = [];
function makeWalkingGraph() {
  const nodes = new Map(), stops = [];
  function node(x,y) {
    const key = Math.round(x*1000)+','+Math.round(y*1000);
    if (!nodes.has(key)) nodes.set(key,{key,x,y,links:[]});
    return nodes.get(key);
  }
  function link(a,b) {
    if (a===b || a.links.includes(b)) return;
    a.links.push(b); b.links.push(a);
  }
  const sides=[[0,-1],[1,0],[0,1],[-1,0]];
  function corners(i,j,dx,dy) {
    return [-1,1].map(side=>node(i+.5+.44*(dx+side*dy),j+.5+.44*(dy-side*dx)));
  }
  for(let j=0;j<N;j++) for(let i=0;i<N;i++) {
    if(!isRoad(i,j)) continue;
    for(const [dx,dy] of sides) {
      const [a,b]=corners(i,j,dx,dy);
      if(isRoad(i+dx,j+dy)) {
        const [e,f]=corners(i+dx,j+dy,-dx,-dy);
        // A corner surrounded by four road tiles contains asphalt instead of kerb.
        if(!isRoad(i-dy,j+dx) || !isRoad(i+dx-dy,j+dy+dx)) link(a,f);
        if(!isRoad(i+dy,j-dx) || !isRoad(i+dx+dy,j+dy-dx)) link(b,e);
      } else {
        const mid=node((a.x+b.x)/2,(a.y+b.y)/2);
        link(a,mid);link(mid,b);
      }
    }
  }
  for(let j=0;j<N;j++) for(let i=0;i<N;i++) {
    const tile=tileAt(i,j), d=tile && DEFS[tile.id];
    if(!d || !['home','shop','svc','hall'].includes(d.type))continue;
    const entrances=spriteOf(tile.id)?.entrances;
    if(!entrances?.length)continue;
    const [w,h]=fpOf(tile.id,tile.turned), L=i+.035,R=i+w-.035,T=j+.035,B=j+h-.035;
    // Clockwise distance around this lot. Follow its boundary even if the road
    // runs along the rear of the building.
    const width=R-L,height=B-T,perimeter=2*(width+height);
    const rim=[{x:L,y:T,s:0},{x:R,y:T,s:width},{x:R,y:B,s:width+height},{x:L,y:B,s:2*width+height}];
    const access=[];
    function add(x,y,s,rx,ry,sideX,sideY){
      if(!isRoad(rx,ry))return;
      const kerb=node(rx+.5+.44*sideX,ry+.5+.44*sideY);

    for(let u=0;u<w;u++){

function walkRoute(from,to){
  const queue=[from.kerb],parent=new Map([[from.kerb,null]]);
  for(let k=0;k<queue.length && !parent.has(to.kerb);k++){
    const n=queue[k];
    for(const to of n.links)if(!parent.has(to)){
      parent.set(to,n);queue.push(to);
    }
  }
  if(!parent.has(to.kerb))return [];
  const road=[];
  for(let n=to.kerb;n!==from.kerb;){
    road.push({x:n.x,y:n.y});n=parent.get(n);
  }
  const raw=[...from.path,...road.reverse(),...to.path.slice(0,-1).reverse()];
  const pts=[];
  for(const p of raw)if(!pts.length || Math.hypot(p.x-pts.at(-1).x,p.y-pts.at(-1).y)>.003)pts.push(p);

  const rounded=[pts[0]];
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i-1],b=pts[i],c=pts[i+1];
    const m=Math.hypot(a.x-b.x,a.y-b.y),n=Math.hypot(c.x-b.x,c.y-b.y),r=Math.min(.035,m/3,n/3);

    rounded.push(p,{x:(p.x+2*b.x+q.x)/4,y:(p.y+2*b.y+q.y)/4},q);
  }

}
function spawnWalker() {
  const group=walkingGraph[Math.floor(Math.random()*walkingGraph.length)];
  const start=Math.floor(Math.random()*group.length);
  const end=(start+1+Math.floor(Math.random()*(group.length-1)))%group.length;
  const path=walkRoute(group[start],group[end]);

}
function startWalker(path){
  if(path.length<2)return;
  const p=path[0], routeTiles=new Set();
  for(let k=1;k<path.length;k++){
    const a=path[k-1],b=path[k],steps=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)*4));
    for(let n=0;n<=steps;n++){
      const x=a.x+(b.x-a.x)*n/steps,y=a.y+(b.y-a.y)*n/steps;
      // Include the adjoining kerb: building a connecting road can remove it.
      for(const dx of [-.075,.075])for(const dy of [-.075,.075])
        routeTiles.add(Math.floor(y+dy)*N+Math.floor(x+dx));
    }
  }
  walkers.push({path,routeTiles,x:p.x,y:p.y,index:1,progress:0,travel:0,phase:0,
    pace:.21+Math.random()*.065,skin:Math.floor(Math.random()*4),facing:1,alpha:0});
}
function updateWalkers(dt){
  if(document.hidden || dt<=0)return;
  if(!walkingGraph)walkingGraph=makeWalkingGraph();
  const target=Math.min(16,Math.ceil(S.pop/3));
  nextWalkerIn-=dt;
  if(walkingGraph.length && walkers.length<target && nextWalkerIn<=0){
    spawnWalker();nextWalkerIn=1.8+Math.random()*2.8;
  }
  for(let k=walkers.length-1;k>=0;k--){
    const w=walkers[k];
    if(w.retire){w.alpha=Math.max(0,w.alpha-dt*4);if(!w.alpha)walkers.splice(k,1);continue;}
    const lastPoint=w.path.at(-1);
    const nearEnd=w.index>=w.path.length-2?Math.hypot(w.x-lastPoint.x,w.y-lastPoint.y):1;
    const ease=Math.min(1,.45+5*Math.min(w.travel,nearEnd));
    let remaining=w.pace*dt*ease;
    while(remaining>0 && w.index<w.path.length){
      const a=w.path[w.index-1],b=w.path[w.index];
      const length=Math.hypot(b.x-a.x,b.y-a.y);
      const step=Math.min(remaining,length-w.progress);
      w.progress+=step;w.travel+=step;remaining-=step;
      const f=w.progress/length;
      w.x=a.x+(b.x-a.x)*f;w.y=a.y+(b.y-a.y)*f;
      const s=P(a.x,a.y),e=P(b.x,b.y);

      w.phase=Math.sin(w.travel*42);
      const end=w.path.at(-1);
      const exit=w.index>=w.path.length-2?Math.hypot(end.x-w.x,end.y-w.y):1;
      const opacity=Math.min(1,w.travel/.09,exit/.09);
      w.alpha=opacity*opacity*(3-2*opacity);
      if(w.progress>=length-.000001){w.index++;w.progress=0;}
    }

// Baseline for cities saved before footprint tracking. Unlisted lots were one tile.
const originalLotSizes = {town:'3x2',gas:'2x2',warehouse:'3x2',skyscraper:'2x2',solar2:'2x2',nuclear:'7x5',needle:'2x2',space:'4x3',banksiaDuplex:'2x1',tidalBaths:'2x2',sunhouse:'2x1',pelicanLight:'2x2'};
function reconcileLotSizes(city) {
  const previous = city.lotSizes || originalLotSizes;
  const sizes = {};
  for (const id of Object.keys(DEFS)) {
    const [w,h] = fpOf(id);
    if (w*h > 1) sizes[id] = w+'x'+h;
  }
  const owners = new Map();
  const resized = [];
  city.tiles.forEach((tile,i) => {
    if (!tile) return;
    const anchor = tile.id === '_occ' ? tile.ref[1]*N+tile.ref[0] : i;
    if (!owners.has(anchor)) owners.set(anchor,[]);
    owners.get(anchor).push(i);
    if (tile.id !== '_occ' && (previous[tile.id] || '1x1') !== (sizes[tile.id] || '1x1')) resized.push(i);
  });
  const claimed = new Set();
  function clear(anchor) {
    for (const index of owners.get(anchor) || []) city.tiles[index] = null;
    owners.delete(anchor);
  }
  function storeBuilding(anchor) {
    city.bagUnread = true;
    city.bagPopupPending = (city.bagPopupPending || 0) + 1;
    (city.storedBuildings ||= []).push({building:city.tiles[anchor],from:[anchor%N,Math.floor(anchor/N)]});
    clear(anchor);
  }
  for (const anchor of resized) {
    const building = city.tiles[anchor];
    if (!building || building.id === '_occ') continue;
    const x = anchor%N, y = Math.floor(anchor/N);
    const [w,h] = fpOf(building.id,building.turned);
    const cells = [], blockers = new Set();
    let fits = true;
    for (let dy=0;dy<h;dy++) for (let dx=0;dx<w;dx++) {
      const col=x+dx, row=y+dy, index=row*N+col;
      if (!inB(col,row) || col<city.lo || row<city.lo || col>=N-city.lo || row>=N-city.lo) { fits=false; continue; }
      cells.push(index);
      const tile=city.tiles[index];
      if (!tile) continue;
      const owner=tile.id==='_occ' ? tile.ref[1]*N+tile.ref[0] : index;
      if (owner===anchor) continue;
      if (tile.id==='road' || claimed.has(owner)) fits=false;
      else blockers.add(owner);
    }
    if (!fits) { storeBuilding(anchor); continue; }
    for (const owner of blockers) storeBuilding(owner);
    clear(anchor);
    for (const index of cells) city.tiles[index]=index===anchor ? building : {id:'_occ',ref:[x,y]};
    owners.set(anchor,cells);
    claimed.add(anchor);
  }
  city.lotSizes=sizes;
}

  S.firstRun=false; S.tut=null; S.tutDone=true; S.level=5;
  S.tiles[24*N+24]=newTile('gym');
  S.tiles[24*N+25]={...newTile('house'),lvl:4,rent:78};
  for (let x=23;x<=28;x++) S.tiles[25*N+x]=newTile('road');
}
// Earlier previews already packed some buildings without exposing the bag.
if (!S.bagNoticeVersion && S.storedBuildings?.length) {
  S.bagUnread = true;
  S.bagPopupPending = S.storedBuildings.length;
}
S.bagNoticeVersion = 1;
reconcileLotSizes(S);
$('#nav [data-open="bag"]').classList.toggle('bag-unread',!!S.bagUnread);
if (S.bagUnread) save();
S.tiles.forEach((tile, index) => {
  if (tile?.id === 'ferris') {
    S.tiles[index] = null;
    S.cash += 9000;
  }
});
if (S.items) delete S.items.ferris;
const loadedSaveTime = S.saved || 0;
if (S.tut && !S.tutDone && S.tut.version!==3) {
  // Convert old ten-step tutorial saves without replacing established towns.
  if(!findHall() && S.tiles.every(t=>!t||t.id==='road'))seedTutorialTown(S);
  S.tut={version:3,step:0,ev:{},started:false};
  if(countOf('house')>=2)S.tut.step=1;
  if(S.tut.step>=1&&hasB('wind'))S.tut.step=2;
  if(S.tut.step>=2&&hasB('wtower'))S.tut.step=3;
  if(S.tut.step>=3&&hasB('bakery'))S.tut.step=4;
}
if (S.loginClaimDay == null) S.loginClaimDay = -1;
if (S.tiles && S.tiles.length !== N * N) { const oN = Math.round(Math.sqrt(S.tiles.length)), off = Math.floor((N - oN) / 2), nt = Array(N * N).fill(null); for (let j = 0; j < oN; j++) for (let i = 0; i < oN; i++) { const t = S.tiles[j * oN + i]; if (!t) continue; if (t.id === '_occ' && t.ref) t.ref = [t.ref[0] + off, t.ref[1] + off]; nt[(j + off) * N + i + off] = t; } S.tiles = nt; }
// Honour the old opening costs and keep partial sets by rounding up once.
const legacyCrateCosts = { steel: 3, gold: 2, diamond: 1 };
S.wheelPips = Math.max(0, Math.floor(Number(S.wheelPips) || 0)) % SPINS_PER_GOLD_CRATE;
const ownedCrates = S.crates || {};
for (const [tier, cost] of Object.entries(legacyCrateCosts)) {
  const oldKeys = Math.max(0, Math.floor(Number(S.keys?.[tier]) || 0));
  ownedCrates[tier] = Math.max(0, Math.floor(Number(ownedCrates[tier]) || 0)) + Math.ceil(oldKeys / cost);
}
ownedCrates.steel += Math.max(0, Math.floor(Number(ownedCrates.wood) || 0));
delete ownedCrates.wood;
S.crates = ownedCrates;
const receivedGoldGift = !S.harbourGoldGiftClaimed;
if (receivedGoldGift) {
  S.crates.gold += 1;
  S.harbourGoldGiftClaimed = true;
}
for (const task of S.daily || []) {
  if (task.rew?.k === 'key') task.rew.k = 'crate';
}
delete S.keys;
if (receivedGoldGift) {
  // Persist the gift with its receipt while preserving the cloud-restore timestamp.
  try { localStorage.setItem(SAVE_KEY, saveJSON()); } catch { /* Regular saves retry. */ }
}
if (!S.grind) S.grind = { d: 0, t: 0 };
if (S.dice > 15) S.dice = 15;
S.dicePos = (S.dicePos || 0) % 12;
S.items = Object.assign({ fountain: 0, statue: 0, flowers: 0, sakura: 0 }, S.items || {});
S.shopItems = Object.assign({}, S.shopItems || {});
for (const id of Object.keys(S.shopItems)) if (!MARKET[id]) delete S.shopItems[id];
if (!S.market) S.market = { week: 0, bought: {}, seen: 0 };
(function catchUp() {
  const el = Math.max(0, now() - (S.saved || now()));
  if (el > 10000) {
    derive(); S.pop = Math.min(D.cap, S.pop + Math.min(20, Math.floor(el / 45000)) * 2);
    const got = bizOffline(S.saved, now()); S.cash += got; save();
    if (el > 60000 && !S.upgraded && got > 0) setTimeout(() => toast('Welcome back! Your businesses earned ' + fmt(got) + ' Coins while you were away.'), 600);
  }
  S.busT = Math.min(S.busT || now() + 8000, now() + (S.tut ? 8000 : MOVE_IN_INTERVAL));
})();
updateSky(true);
if (LOC.src !== 'gps') askLocation(false);
addEventListener('resize', () => { resize(); clampCam(); });
let hiddenSince = document.hidden ? now() : 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenSince = now(); save(); return; }
  if (hiddenSince) {
    S.cash += bizOffline(hiddenSince, now());
    hiddenSince = 0;
    save();
  }
  updateSky();
});
const reviewId = new URLSearchParams(location.search).get('model');
if (reviewId && Object.hasOwn(DEFS, reviewId)) {
  const sprite = spriteOf(reviewId);
  if (sprite) {
    const panel = document.createElement('dialog');
    panel.style.cssText = 'text-align:center;color:white;background:#233750;border:2px solid #546d87;width:min(85vw,360px)';
    const title = document.createElement('h2');
    title.textContent = DEFS[reviewId].name;
    const art = document.createElement('canvas');
    art.width = sprite.img.width;
    art.height = sprite.img.height;
    art.style.cssText = 'display:block;width:90%;margin:20px auto;image-rendering:pixelated';
    art.getContext('2d').drawImage(sprite.img,0,0);
    const close = document.createElement('button');
    close.className = 'pixel-btn pb';
    close.textContent = 'Back to town';
    close.onclick = () => panel.close();
    panel.append(title,art,close);
    document.body.append(panel);
    panel.showModal();
  }
}
resize(); derive(); const landing=findHall(); centerOn(landing?.i??MID, landing?.j??MID); paintStaticIcons(); updateHUD();
if (S.travelPending) showDepartureReward();
else if (S.upgraded || S.firstRun) {
  welcome(!!S.upgraded);
  if (receivedGoldGift) {
    const gift = document.createElement('p');
    gift.className = 'wl-s';
    gift.textContent = 'A free Gold crate is waiting in Harbour Freight.';
    $('#modalBox .wl-s').after(gift);
  }
} else if (receivedGoldGift) {
  toast('Login gift: +1 Gold crate in Harbour Freight.');
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { resize(); paintStaticIcons(); lastClockKind = ''; lastFace = -1; });
requestAnimationFrame(frame);
if (remodelDemo) playRemodelDemo();
async function playRemodelDemo() {
  const panel=document.createElement('aside');
  panel.id='remodelDemoPanel';
  panel.innerHTML='<p role="status"></p><a href="?demo=remodel">Replay</a> · <a href="./">Exit demo</a>';
  document.body.append(panel);
  const caption=panel.querySelector('p');
  const say=async (message,ms)=>{caption.textContent=message; await new Promise(resolve=>setTimeout(resolve,ms));};
  centerOn(25,24);
  await say('This level 4 cottage is next door to Forge Fitness.',3500);
  DEFS.gym.fx=2;
  reconcileLotSizes(S);
  streetNetwork=null; walkingGraph=null; derive(); changed(); save();
  $('#nav [data-open="bag"]').classList.add('bag-unread');
  showBagNotice();
  await say('The gym needs the yellow plot. The game packs the cottage and alerts the player.',3800);
  $('#bagLater')?.click();
  await say('The satchel stays highlighted after choosing Later.',2300);
  $('#nav [data-open="bag"]').click();
  await say('Open My items. The cottage is under Moved buildings, still level 4.',3600);
  sheetBody.querySelector('[data-act="restore"]')?.click();
  if (!placing?.stored) return;
  placing.ghost={i:27,j:24}; renderCard(true);
  await say('Choose a clear plot beside the road and tap Place.',2800);
  card.querySelector('[data-act="confirmPlace"]')?.click();
  if (tileAt(27,24)?.lvl===4 && !S.storedBuildings.length)
    caption.textContent='The level 4 cottage is back in town. Placement cost 0 coins.';
}
})();
</script>
