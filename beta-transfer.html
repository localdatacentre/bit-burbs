<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bit-Burbs · beta transfer</title><style>body{margin:10vh auto;padding:24px;max-width:30rem;background:#172c30;color:#fff5d6;font:18px/1.5 system-ui}h1{font:700 27px monospace}button{padding:14px;border:2px solid #548883;background:#286563;color:white;font-weight:bold}a{color:#ffe29c}</style></head><body><h1>Bit-Burbs beta transfer</h1><p>Open this page in the same browser or installed app where you play. Download a copy of your city, then choose “Move my beta city” on the new island.</p><button id="download">Download my city</button><p role="status" id="status"></p><script>
document.getElementById('download').onclick=()=>{
 const status=document.getElementById('status');
 try{
  const raw=localStorage.getItem('blocktown-save-v1'),city=JSON.parse(raw);
  if(!city||!Array.isArray(city.tiles))throw Error('No live city found here. Open the transfer page on the device and browser that has your beta city.');
  const url=URL.createObjectURL(new Blob([raw],{type:'application/json'})),a=document.createElement('a');
  a.href=url;a.download='bit-burbs-beta-city.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  status.textContent='Your save copy is ready. Your current city is still here.';
 }catch(e){status.textContent=e.message;}
};
</script></body></html>
