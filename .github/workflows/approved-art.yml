name: Approved model artwork
on: [push, pull_request]
jobs:
  approved-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/approved-art.cjs
      - run: node tests/gym-replacement.cjs
      - run: node tests/binlink-free.cjs
