name: Mobile safe-area layout
on:
  push:
    paths:
      - '*.html'
      - '**/*.css'
      - 'tests/mobile_safe_area.py'
      - 'tests/mobile_placement.py'
      - 'tests/camera.cjs'
      - 'tests/city-render.cjs'
      - 'tests/live-pages.cjs'
      - '.github/workflows/mobile-layout.yml'
  pull_request:
    paths:
      - '*.html'
      - '**/*.css'
      - 'tests/mobile_safe_area.py'
      - 'tests/mobile_placement.py'
      - 'tests/camera.cjs'
      - 'tests/city-render.cjs'
      - 'tests/live-pages.cjs'
      - '.github/workflows/mobile-layout.yml'
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - name: Check city pages, camera and terrain rendering
        run: |
          node tests/live-pages.cjs
          node tests/city-render.cjs
      - run: python tests/mobile_safe_area.py
