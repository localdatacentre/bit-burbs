// For a fixed isometric screen pixel, the highest surface on its viewing ray is nearest.
function depthFaces(k,point){
 const frame=k.ctx.canvas,heights=new Float32Array(frame.width*frame.height).fill(-Infinity);
 function project(p){
  const [x,y]=point(p[0],p[1]),s=k.sc(x,y,p[2]);
  return {x:s.x,y:s.y,z:p[2],wx:p[0],wy:p[1]};
 }
 function triangle(a,b,c,colour){
  const det=(b.y-c.y)*(a.x-c.x)+(c.x-b.x)*(a.y-c.y);
  if(Math.abs(det)<1e-6)return;
  for(let y=Math.floor(Math.min(a.y,b.y,c.y));y<Math.ceil(Math.max(a.y,b.y,c.y));y++){
   for(let x=Math.floor(Math.min(a.x,b.x,c.x));x<Math.ceil(Math.max(a.x,b.x,c.x));x++){
    const dx=x+.5-c.x,dy=y+.5-c.y,u=((b.y-c.y)*dx+(c.x-b.x)*dy)/det,
          v=((c.y-a.y)*dx+(a.x-c.x)*dy)/det,w=1-u-v;
    if(Math.min(u,v,w)<-.00001)continue;
    const z=u*a.z+v*b.z+w*c.z,i=y*frame.width+x;
    if(heights[i]>z+.0001)continue;
    heights[i]=z;
    k.px(x,y,typeof colour==='function'?colour(u*a.wx+v*b.wx+w*c.wx,u*a.wy+v*b.wy+w*c.wy):colour);
   }
  }
 }
 function face(pts,colour){
  const projected=pts.map(project);
  for(let n=1;n+1<pts.length;n++)triangle(projected[0],projected[n],projected[n+1],colour);
 }
 return face;
}

 function fenceRun(x,y,X,Y){
  const length=Math.hypot(X-x,Y-y),dx=(X-x)/length,dy=(Y-y)/length;
  const panels=Math.ceil(length/10);
  for(let pane=0;pane<panels;pane++){
   const start=length*pane/panels,end=length*(pane+1)/panels,span=end-start;
   const p=(u,h)=>[x+dx*(start+u),y+dy*(start+u),h];
   const [ax,ay]=p(0,0),[bx,by]=p(span,0);
   part(Math.min(ax,bx)-.12,Math.min(ay,by)-.12,Math.max(ax,bx)+.12,Math.max(ay,by)+.12,()=>{
    // Alternating diagonals meet at the rails, with open air between the wires.
    const cells=4,pitch=span/cells;
    for(let n=0;n<cells;n++){
     const a=n*pitch,m=a+pitch/2,b=a+pitch;
     edge(p(a,1.3),p(m,4.9),'#7F9089');edge(p(m,4.9),p(b,1.3),'#7F9089');
     edge(p(a,8.5),p(m,4.9),'#899A90');edge(p(m,4.9),p(b,8.5),'#899A90');
    }
    edge(p(0,1.3),p(span,1.3),'#647972');edge(p(0,8.5),p(span,8.5),'#677C75');
    for(const u of pane===panels-1?[0,span]:[0]){
     const [vx,vy]=p(u,0);
     box(vx-.24,vy-.24,vx+.24,vy+.24,0,10,'#657A73','#50665F','#A6B4A8');
    }
    edge(p(0,10.2),p(span,10.2),'#637871');

     edge(p(u-.36,9.15),p(u+.32,11.1),'#697C75');
     edge(p(u-.33,10.9),p(u+.31,9.5),'#87988D');
    }
   });
  }
 }

 function round(x,y,z,Z,r,R,c,cap,detail){
  const points=Array.from({length:16},(_,i)=>[Math.cos(i*Math.PI/8),Math.sin(i*Math.PI/8)]);
  const ring=(p,r,h)=>[x+r*p[0],y+r*p[1],h];
  const [ox,oy]=point(x,y);
  for(let i=0;i<16;i++){
   const a=points[i],b=points[(i+1)%16],[u,v]=point(x+(a[0]+b[0])/2,y+(a[1]+b[1])/2);
   if(u+v<=ox+oy)continue;
   const shade=[1.09,1.03,.96,.86,.78][Math.max(0,Math.min(4,Math.floor((u-ox+1)*2.5)))];
   poly([ring(a,r,z),ring(b,r,z),ring(b,R,Z),ring(a,R,Z)],sh(c,shade));
   if(detail)detail(i,a,b);
  }
  if(cap)poly(points.map(p=>ring(p,R,Z)),cap);
 }

function startDoshShop(){

  restockVouchers:['voucher','restock voucher','restock vouchers'],

 function draw(message=''){
  const scrollTop=screen.scrollTop;

  if(shop){
   showBalance('dosh','Dosh',shop.dosh);
   screen.innerHTML+='<div class="shop-menu" aria-label="Daily offers">'+shop.offers.map(offer=>{
    const claimed=shop.claims.includes(offer.id);
    const lines=Object.entries(offer.rewards).map(([key,amount])=>{
     const [sprite,one,many]=rewardLabels[key];
     return `<li>${icon(sprite)}<span>${fmt(amount)} ${amount===1?one:many}</span></li>`;
    }).join('');
    const label=claimed?'Claimed':offer.price?fmt(offer.price)+' Dosh':'FREE';
    return `<article class="tile shop-offer"><ul class="offer-rewards">${lines}</ul><button data-offer="${offer.id}" class="${!offer.price&&!claimed?'primary':''}" ${busy||claimed||shop.dosh<offer.price?'disabled':''}>${label}</button></article>`;
   }).join('')+'</div>';
  }else if(!busy && !needsCity)screen.innerHTML+='<button data-shop-retry>Try again</button>';
  screen.innerHTML+='<p id="dosh-shop-status" class="small" role="status"></p>';
  $('#dosh-shop-status').textContent=message||(busy?'Checking shop…':'');
  paint();
  screen.scrollTop=scrollTop;
 }
 async function update(offer){
  if(busy)return;
  busy=true;
  draw();
  let message='';
  try{
   const response=globalThis.BBStage.liveRelease
    ? await window.liveCityRelease('releaseShop',offer?{offer,day:shop.day}:null)
    : await fetch('/staging/api/shop',offer?{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({offer,day:shop.day})
   }:{cache:'no-store'});
   const result=await response.json();
   if(response.status===401||response.status===403)throw Object.assign(new Error(result.error||'Sign in to your city to continue.'),{status:response.status});
   needsCity=false;
   if(result.offers){
    shop=result;
    const city=cityView.get('city');
    if(city && globalThis.BBStage.liveRelease && response.ok){
     const offerDate=new Date(result.day*86400000).toISOString().slice(0,10);
     localStorage.setItem('bit-burbs:roster2:'+city+':shop-visit',offerDate);
    }
   }
   if(!response.ok)message=result.error||'Could not load the shop.';
   else if(offer)message='Rewards added to your city.';
  }catch(error){
   needsCity=error.status===401||error.status===403;
   if(needsCity){shop=null;$('#wallet').replaceChildren();}
   message=needsCity?error.message:'Connection interrupted. Try again.';
  }
  finally{
   busy=false;
   draw(message);
   clearTimeout(timer);
   if(shop)timer=setTimeout(()=>update(),Math.max(1000,shop.resetAt-Date.now()+250));
  }
 }
 screen.addEventListener('click',event=>{
  const button=event.target.closest('button');
  if(button?.dataset.offer)update(button.dataset.offer);
  else if(button?.hasAttribute('data-shop-retry'))update();
 });
 addEventListener('pageshow',event=>{if(event.persisted)update();});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)update();});
 update();
}

 // Flush the starting positions once so the first movement begins on the next frame.
 dialog.getBoundingClientRect();

   },{once:true});
   reel.style.transition='transform '+(rollMs+index*staggerMs)+'ms cubic-bezier(.12,.54,.2,1)';
