<style>
/* Keep each room’s controls inside the phone’s safe area while its contents scroll. */
:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  overflow: hidden;
  background: var(--exchange-navy);
}
html:has(body[data-screen="shop"]) { background: #102b20; }
body {
  --room-surface: var(--exchange-navy);
  --room-chrome: #30364b;
  --room-frame: #121623;
  --room-rule: #151929;
  position: fixed;
  inset: var(--safe-top) var(--safe-right) 0 var(--safe-left);
  overflow: hidden;
}
body[data-screen="shop"] {
  --room-surface: #204932;
  --room-chrome: #2b6041;
  --room-frame: #102d1e;
  --room-rule: #153924;
}
body:not([data-city-preview]) .exchange {
  width: 100%;
  max-width: var(--page-shell-width);
  height: 100%;
  height: calc(100dvh - var(--safe-top));
  min-height: 0;
  padding: 0 0 var(--safe-bottom);
  overflow: hidden;
  background: var(--room-surface);
  border: var(--page-frame-width) solid var(--room-frame);
}
.exchange > header { position: relative; }
#roomNotice {
  position: absolute;
  z-index: 12;
  top: calc(100% + 8px);
  left: var(--page-head-inline);
  max-width: calc(100% - 2 * var(--page-head-inline));
  pointer-events: none;
  overflow-wrap: anywhere;
  font: 20px/1.1 VT323, monospace;
  color: #fff;
}
#roomNotice:not(:empty) {
  padding: 7px 10px;
  background: var(--room-chrome);
  border: 2px solid var(--room-frame);
  box-shadow: 0 2px 0 var(--room-rule);
}
#dosh-shop-status:empty { display: none; }
body:not([data-city-preview]) .exchange > header {
  flex: none;
  padding: var(--page-head-block) var(--page-head-inline);
  background: var(--room-chrome);
  border-bottom: var(--page-frame-width) solid var(--room-rule);
}
.exchange #wallet .currency {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  vertical-align: middle;

.exchange #wallet .currency .icon {
  width: var(--page-currency-size);
  height: var(--page-currency-size);
  margin: 0;

 if(globalThis.BBStage && ['buy-crate','open-crate','open-three','finish-opening'].includes(action))return;
 if(action==='close-modal'){closeModal();return;}
 if(action==='buy-crate'){if($('#modalRoot').children.length)return;const cost=tiers[tierIndex][1];if(data.wallet.crateVouchers<cost)return;data.wallet.crateVouchers-=cost;data.stock[tierIndex]++;save();render();return;}
 if(action==='view-storage'){closeModal();page='storage';render();return;}
 if(action==='open-crate'||action==='open-three'){openCrate(action==='open-three'?3:1);return;}
 if(action==='skip-opening'){reveal(true);return;}
 if(action==='finish-opening'){const opening=data.opening;data.opening=null;try{save();}catch{data.opening=opening;toast('Could not close the reward. Try again.');return;}animation=null;closeModal();render();return;}
 if(action.startsWith('confirm-replace-')){const i=Number(action.split('-').at(-1));if(!data.replaced){data.replaced=true;taskList[i][0]='Trade through Paper Finch Books';taskList[i][2]=0;save();}closeModal();render();return;}
 if(action.startsWith('pack-')||action.startsWith('place-')){const placed=action.startsWith('place-'),id=action.slice(placed?6:5),a=data.assets.find(a=>a.id===id);if(a&&(a.state==='inventory'||a.state==='placed')){a.state=placed?'placed':'inventory';save();}closeModal();render();return;}
 if(action==='crate-odds'){modal(tiers[tierIndex][0]+' · full odds',crateTables[tierIndex].map(r=>`<div class="table-row"><span>${r[1]==='diamond'?models[featured()]:r[1]==='boost'?'10-minute 2× boost':(r[3]?r[2].toLocaleString()+'–'+r[3].toLocaleString():r[2])+' '+({cash:'coins',dosh:'dosh',deeds:'deeds',wheelTickets:'wheel tickets'}[r[1]])}</span><span>${r[0]}%</span></div>`).join(''),[['Close','close-modal',true]]);return;}
 if(action==='wheel-odds'){modal('Lucky Wheel · full odds',`<p>15% · 1 restock voucher<br>10% · 2 restock vouchers<br>5% · 6,000 coins<br>10% · 10 dosh<br>5% · 25 dosh<br>10% · 1 deed<br>2% · 2 deeds<br>20% · 1 crate voucher<br>15% · 2 crate vouchers<br>8% · 5 crate vouchers</p>`,[['Close','close-modal',true]]);return;}
 if(action==='wheel-demo'){toast('Wheel layout preview. The approved wheel table is shown in Full odds; this preview does not simulate extra unapproved spins.');return;}
 if(action==='shop-3'&&!data.freeShopClaimed){data.freeShopClaimed=true;data.wallet.cash+=2000;save();render();return;}
 if(action==='boost-demo'&&data.boosts){data.boosts--;save();render();toast('One stored 10-minute boost used in this preview. No live city was changed.');return;}
 if(['save-demo','account-demo','logout-demo'].includes(action)){toast('Account preview only. You remain signed into your real city.');return;}
});
document.addEventListener('change',e=>{if(practiceCity && e.target.id==='reelTiming'){const seconds=Number(e.target.value);if([4,7,10].includes(seconds)){data.settings.reelSeconds=seconds;save();}return;}if(e.target.dataset.setting){data.settings[e.target.dataset.setting]=e.target.checked;save();render();}});
function refreshRotation(){
 if(globalThis.BBStage)return; // The server publishes the active edition.
 const next=rotationStart+(slot()+1)*fortnight;
 if(slot()<rotation.length-1)setTimeout(()=>{if(!data.opening){closeModal();render();}refreshRotation();},Math.min(2147483647,Math.max(1,next-Date.now())));
}
refreshRotation();
if(shopPreview && globalThis.BBStage)startDoshShop();
else if(shopPreview||testWallet)render();
else{
 const bar=document.getElementById('exchangeAccount');
 if(globalThis.BBStage){bar.textContent=data.crateInventoryError||'';render(!embeddedCrates);}
 else bar.textContent='Loading your Exchange…';
 const accountScript=document.createElement('script');
 accountScript.src='./exchange-account.js?v=instant-rooms';
 accountScript.onerror=()=>{bar.textContent='Exchange could not load. ';const retry=document.createElement('button');retry.textContent='Retry';retry.onclick=()=>location.reload();bar.append(retry);};
 document.body.append(accountScript);
}
